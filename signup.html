<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign-Up | Riptide Officials</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#0a2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Officials">
<link rel="icon" href="assets/img/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main id="app"><div class="card loading">Loading...</div></main>
<div class="footer" id="site-footer"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/app.js"></script>
<script>
/* Public by link: anyone with this page's URL can sign up (no login).
   Names/certifications go in a public-readable doc; email, phone and comments go to an admin-only doc. */
(function () {
  var R = window.Riptide, esc = R.esc, app = document.getElementById("app");
  R.footer();
  var meetId = new URLSearchParams(location.search).get("m");
  if (!R.configured) { R.renderHeader({}, ""); app.innerHTML = R.setupBanner(); return; }

  R.getContext().then(function (ctx) {
    R.renderHeader(ctx, "meets");
    if (!meetId) { app.innerHTML = '<div class="card"><h2>Meet not found</h2><p>This link is missing its meet code. Please use the full link you were sent.</p></div>'; return; }
    var meetRef = R.db.collection("meets").doc(meetId);
    var claims = {}, WK = { "Meet Referee": "meetRef", "Admin Official": "admin" };
    function findKey() {
      var q = new URLSearchParams(location.search).get("e"), ls = null;
      if (q) return Promise.resolve(q);
      try { ls = localStorage.getItem("ro_su_" + meetId); } catch (x) {}
      if (ctx.user) return R.db.collection("users").doc(ctx.user.uid).collection("mysignups").doc(meetId).get()
        .then(function (sn) { return sn.exists ? sn.data().key : ls; }).catch(function () { return ls; });
      return Promise.resolve(ls);
    }
    meetRef.get().then(function (snap) {
      if (!snap.exists) { app.innerHTML = '<div class="card"><h2>Meet not found</h2><p>This sign-up link is not valid. Please check the link you were sent.</p></div>'; return; }
      document.title = "Sign up: " + snap.data().title + " | Riptide Officials";
      return findKey().then(function (key) {
        return meetRef.collection("whole").get().then(function (cs) {
          var cl = {}; cs.docs.forEach(function (d) { cl[d.id] = d.data(); }); return cl;
        }).catch(function () { return {}; }).then(function (cl) {
          claims = cl;
          if (!key) return render(snap.data(), null, null);
          return meetRef.collection("contacts").doc(key).get().then(function (c) {
            if (c.exists) render(snap.data(), key, c.data()); else render(snap.data(), null, null, !!new URLSearchParams(location.search).get("e"));
          }).catch(function () { render(snap.data(), null, null); });
        });
      });
    }).catch(function () { app.innerHTML = '<div class="msg err">Could not load this meet. Please try again.</div>'; });

    function render(m, key, ex, badLink) {
      var editing = !!key; ex = ex || {};
      var n = R.normMeet(m), detailsUrl = "meet.html?m=" + encodeURIComponent(meetId);
      function has(list, v) { return (Array.isArray(list) ? list : []).indexOf(v) >= 0; }
      function mine(i, kind) {   // what this person chose for session i
        if (Array.isArray(ex.perSession)) {
          var f = ex.perSession.filter(function (x) { return x.i === i; })[0];
          return f ? (f[kind] || []) : [];
        }
        return i === 0 ? (kind === "work" ? (ex.certified || []) : (ex.shadow || [])) : [];   // sign-ups made before sessions existed
      }
      var CL = ex.certLevels || {};
      function lvBox(v, on) {   // "N2" / "N3" tickers next to a position the person is certified in
        return '<span class="lv"' + (on ? "" : ' style="display:none"') + ">" + ["N2", "N3"].map(function (L) {
          return '<label class="lvl"><input type="checkbox" data-lv="' + L + '" data-pos="' + esc(v) + '"' + (has(CL[v], L) ? " checked" : "") + "> " + L + "</label>";
        }).join("") + "</span>";
      }
      function adminCert() {   // certified as Admin Official without signing up for it, so coordinators know who else is certified
        var on = Object.prototype.hasOwnProperty.call(CL, "Admin Official");
        return '<div class="chk2"><label class="pos"><input type="checkbox" data-certonly="1" value="Admin Official"' + (on ? " checked" : "") + "> Admin Official</label>" + lvBox("Admin Official", on) + "</div>";
      }
      function checks(name, list, chosen, attr) {
        return '<div class="checks">' + list.map(function (v) {
          var on = name === "work" && has(chosen, v);
          if (name !== "work") return '<label class="chk"><input type="checkbox" ' + attr + ' value="' + esc(v) + '"' + (on || has(chosen, v) ? " checked" : "") + "> " + esc(v) + "</label>";
          return '<div class="chk2"><label class="pos"><input type="checkbox" ' + attr + ' value="' + esc(v) + '"' + (on ? " checked" : "") + "> " + esc(v) + "</label>" + lvBox(v, on) + "</div>";
        }).join("") + "</div>";
      }
      function wshadowChecks(list) {   // Meet Referee / Admin Official shadowing sits with the session shadow choices
        return list.length ? '<div class="checks" style="margin-bottom:6px">' + list.map(function (p) {
          return '<label class="chk"><input type="checkbox" data-wshadow="1" value="' + esc(p) + '"' + (editing && has(ex.shadow, p) ? " checked" : "") + "> " + esc(p) + "</label>";
        }).join("") + "</div>" : "";
      }
      var sessCards = n.sessions.map(function (x, i) {
        var single = n.sessions.length === 1, wsh = (i === 0 ? n.whole : []);
        var dTitle = single && x.date ? new Date(x.date + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" }) : "";
        return '<div class="card"><h2>' + esc(single ? (dTitle || "Positions") : x.name) + "</h2>" +
          (R.sessionWhen(x) ? '<p class="when-line" style="margin-top:0">' + esc(R.sessionWhen(x)) + "</p>" : "") +
          (x.positions.length ? "<label>Select all of your certifications, and tick N2 and/or N3 for your national certification levels</label>" + checks("work", x.positions, mine(i, "work"), 'data-s="' + i + '" data-k="work"').replace(/<\/div>$/, i === 0 ? adminCert() + "</div>" : "</div>") : "") +
          (x.shadow.length || wsh.length ? "<label>I would like to shadow (choose as many as you like)</label>" + wshadowChecks(wsh) + checks("shadow", x.shadow, mine(i, "shadow"), 'data-s="' + i + '" data-k="shadow"').replace(/^<div class="checks">/, x.shadow.length ? '<div class="checks">' : '<div class="checks" style="display:none">') : "") +
          (!x.positions.length && !x.shadow.length && !wsh.length ? '<p class="muted">No positions are open for this session.</p>' : "") + "</div>";
      }).join("");
      app.innerHTML =
        '<p style="margin:0 0 10px"><a href="' + detailsUrl + '">&larr; Meet details</a></p>' +
        '<div class="card"><span class="pill green">' + (editing ? "Your sign-up" : "Sign up to work") + '</span><h1 style="margin-top:8px">' + esc(m.title) + "</h1>" +
        "<p style=\"margin-bottom:0\"><strong>" + esc(R.fmtRange(m)) + "</strong>" + (m.location ? "<br>" + esc(m.location) : "") + "</p></div>" +
        (editing ? '<div class="msg info">You already signed up for this meet. Make your changes below and tap <strong>Save changes</strong>.</div>' : "") +
        (badLink ? '<div class="msg err">That edit link did not work, so you can sign up again below.</div>' : "") +
        '<form id="su" novalidate>' +
        '<div class="card"><h2>Your information</h2>' +
        '<label for="su-name">Name</label><input id="su-name" autocomplete="name" required>' +
        '<div class="row2"><div><label for="su-email">Email</label><input id="su-email" type="email" autocomplete="email" required></div>' +
        '<div><label for="su-phone">Phone</label><input id="su-phone" type="tel" autocomplete="tel" required></div></div>' +
        '<label for="su-team">Team / club</label><input id="su-team" placeholder="Your team or club">' +
        '<div class="hint" style="margin-bottom:0">Your email and phone are only seen by the officials coordinators.</div></div>' +
        (n.whole.length ? '<div class="card"><h2>Meet Referee and Admin Official</h2><div class="checks">' + n.whole.map(function (p) {
          var c = claims[WK[p]], isMine = editing && has(ex.certified, p);
          if (c && !isMine) return '<div class="chk filled"><span class="filled-tag">Filled</span> ' + esc(p) + ' &mdash; ' + esc(c.name) + "</div>";
          return '<div class="chk2"><label class="pos"><input type="checkbox" data-whole="1" value="' + esc(p) + '"' + (isMine ? " checked" : "") + "> " + esc(p) + "</label>" + lvBox(p, isMine) + "</div>";
        }).join("") + "</div></div>" : "") +
        sessCards +
        '<div class="card"><h2>Comments</h2><label for="su-comments" class="muted small" style="font-weight:400">Arriving late, leaving early, or anything else we should know.</label><textarea id="su-comments" rows="3"></textarea></div>' +
        '<div class="btn-row"><button class="btn green" type="submit" id="su-btn">' + (editing ? "Save changes" : "Sign me up") + "</button>" +
        (editing ? '<button class="btn danger" type="button" id="su-cancel">Cancel my sign-up</button>' : "") + '</div><div id="su-status" role="status"></div></form>';

      var $ = function (id) { return document.getElementById(id); };
      function fillMine() {
        if (editing) {
          $("su-name").value = ex.name || ""; $("su-email").value = ex.email || ""; $("su-phone").value = ex.phone || "";
          $("su-team").value = ex.team || ""; $("su-comments").value = ex.comments || "";
          return;
        }
        if (!ctx.user) return;
        var p = ctx.profile || {};
        $("su-name").value = p.name || ""; $("su-email").value = p.email || ctx.user.email || ""; $("su-phone").value = p.phone || ""; $("su-team").value = "Riptide";
      }
      fillMine();
      document.getElementById("su").addEventListener("change", function (e) {
        var t = e.target;
        if (t.type === "checkbox" && t.closest && t.closest(".chk2") && !t.hasAttribute("data-lv")) {
          var lv = t.closest(".chk2").querySelector(".lv"); if (lv) lv.style.display = t.checked ? "" : "none";
        }
      });
      function picked(sel) { return Array.prototype.map.call(document.querySelectorAll(sel + ":checked"), function (i) { return i.value; }); }
      function uniq(a) { return a.filter(function (v, i) { return a.indexOf(v) === i; }); }

      $("su").addEventListener("submit", function (e) {
        e.preventDefault();
        var st = $("su-status"), btn = $("su-btn");
        var name = $("su-name").value.trim(), email = $("su-email").value.trim(), phone = $("su-phone").value.trim(),
            team = $("su-team").value.trim(), comments = $("su-comments").value.trim();
        var wholeSel = picked("input[data-whole]"), perSession = [], workAll = [], shadowAll = [], names = [];
        n.sessions.forEach(function (x, i) {
          var w = picked('input[data-s="' + i + '"][data-k="work"]'), sh = picked('input[data-s="' + i + '"][data-k="shadow"]');
          if (w.length || sh.length) { perSession.push({ i: i, work: w, shadow: sh }); names.push(x.name); }
          workAll = workAll.concat(w); shadowAll = shadowAll.concat(sh);
        });
        var certified = uniq(wholeSel.concat(workAll)), shadow = uniq(shadowAll.concat(picked("input[data-wshadow]"))), certLevels = {}, certOnly = picked("input[data-certonly]");
        certOnly.forEach(function (p) { certLevels[p] = []; });
        Array.prototype.forEach.call(document.querySelectorAll("input[data-lv]:checked"), function (b) {
          var pos = b.getAttribute("data-pos"), L = b.getAttribute("data-lv");
          if (certified.indexOf(pos) < 0 && certOnly.indexOf(pos) < 0) return;
          certLevels[pos] = certLevels[pos] || [];
          if (certLevels[pos].indexOf(L) < 0) certLevels[pos].push(L);
        });
        var level = Object.keys(certLevels).map(function (p) { return p + (certLevels[p].length ? " " + certLevels[p].join("/") : ""); }).join("; ");
        if (!name || !/^\S+@\S+\.\S+$/.test(email) || !phone) { st.innerHTML = '<div class="msg err">Please fill in your name, a valid email, and your phone number.</div>'; return; }
        if (!certified.length && !shadow.length) { st.innerHTML = '<div class="msg err">Please select at least one position, or something you would like to shadow.</div>'; return; }
        btn.disabled = true; btn.textContent = "Saving...";
        var data = { name: name, team: team, role: (certified.join(", ") || "Shadowing").slice(0, 190), certified: certified, shadow: shadow,
                     perSession: perSession, session: (names.join(", ") || "Whole meet").slice(0, 190), email: email, phone: phone, comments: comments.slice(0, 500), level: level.slice(0, 190), certLevels: certLevels };
        var k = key || R.newId(), ref = meetRef.collection("contacts").doc(k), p;
        var held = editing ? R.WHOLE_POS.filter(function (x) { return has(ex.certified, x); }) : [];
        var toClaim = wholeSel.filter(function (x) { return held.indexOf(x) < 0; }), toRelease = held.filter(function (x) { return wholeSel.indexOf(x) < 0; });
        var taken = [];
        p = toClaim.reduce(function (chain, pos) {
          return chain.then(function () {
            return meetRef.collection("whole").doc(WK[pos]).set({ name: name, team: team, createdAt: firebase.firestore.FieldValue.serverTimestamp() })
              .then(function () { taken.push(pos); });
          });
        }, Promise.resolve()).then(function () {
          return Promise.all(toRelease.map(function (pos) { return meetRef.collection("whole").doc(WK[pos]).delete(); }));
        }).then(function () {
          if (editing) return ref.update(data);
          data.uid = ctx.user ? ctx.user.uid : null; data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          return ref.set(data);
        }).catch(function (err) {
          return Promise.all(taken.map(function (pos) { return meetRef.collection("whole").doc(WK[pos]).delete().catch(function () {}); }))
            .then(function () { var e2 = new Error("claim"); e2.claim = true; throw e2; });
        });
        p.then(function () {
          try { localStorage.setItem("ro_su_" + meetId, k); } catch (x) {}
          if (ctx.user) R.db.collection("users").doc(ctx.user.uid).collection("mysignups").doc(meetId).set({ key: k }).catch(function () {});
          var link = location.href.split("#")[0].split("?")[0] + "?m=" + encodeURIComponent(meetId) + "&e=" + encodeURIComponent(k);
          var mail = "mailto:" + encodeURIComponent(email) + "?subject=" + encodeURIComponent("Your sign-up for " + m.title) +
            "&body=" + encodeURIComponent("Use this private link any time to change or cancel your sign-up for " + m.title + ":\n\n" + link);
          app.innerHTML = '<div class="card"><span class="pill green">' + (editing ? "Saved" : "All set") + '</span><h1 style="margin-top:8px">' +
            (editing ? "Your changes are saved" : "Thank you, " + esc(name.split(" ")[0]) + "!") + "</h1>" +
            "<p>You're signed up for <strong>" + esc(m.title) + "</strong>. The coordinator will post assignments on the meet page.</p>" +
            "<h3>Need to change something later?</h3><p>Come back to this meet's sign-up page on this phone or computer and your sign-up will open for editing" +
            (ctx.user ? " (it is also listed under Account)" : "") + ". To open it anywhere else, save your private link:</p>" +
            '<div class="btn-row"><button class="btn" type="button" id="cp">Copy my edit link</button><a class="btn ghost" href="' + mail + '">Email me my edit link</a>' +
            '<a class="btn ghost" href="' + detailsUrl + '">See meet details</a></div></div>';
          $("cp").onclick = function () { R.copyText(link).then(function () { $("cp").textContent = "Copied!"; }); };
          window.scrollTo(0, 0);
        }).catch(function (err) {
          st.innerHTML = '<div class="msg err">' + (err && err.claim && toClaim.length ? "Sorry, someone just took " + esc(toClaim.join(" / ")) + ". Please refresh the page and pick again." : "Sorry, that didn\'t go through. Please try again.") + "</div>";
          btn.disabled = false; btn.textContent = editing ? "Save changes" : "Sign me up";
        });
      });
      var cancel = $("su-cancel");
      if (cancel) cancel.onclick = function () {
        if (!confirm("Cancel your sign-up for this meet?")) return;
        Promise.all(R.WHOLE_POS.filter(function (x) { return has(ex.certified, x); }).map(function (x) { return meetRef.collection("whole").doc(WK[x]).delete(); }))
          .then(function () { return meetRef.collection("contacts").doc(key).delete(); }).then(function () {
          try { localStorage.removeItem("ro_su_" + meetId); } catch (x) {}
          if (ctx.user) R.db.collection("users").doc(ctx.user.uid).collection("mysignups").doc(meetId).delete().catch(function () {});
          app.innerHTML = '<div class="card"><h1>Your sign-up was cancelled</h1><p>You can sign up again any time from the meet page.</p><div class="btn-row"><a class="btn" href="' + detailsUrl + '">Meet details</a></div></div>';
        }).catch(function () { $("su-status").innerHTML = '<div class="msg err">Could not cancel. Please try again.</div>'; });
      };
    }
  });
})();
</script>
</body>
</html>
