<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign-Up | Riptide Officials</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#0a2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Officials">
<link rel="icon" href="assets/img/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main id="app"><div class="card loading">Loading...</div></main>
<div class="footer" id="site-footer"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/app.js"></script>
<script>
/* Public by link: anyone with this page's URL can sign up (no login).
   Names/certifications go in a public-readable doc; email, phone and comments go to an admin-only doc. */
(function () {
  var R = window.Riptide, esc = R.esc, app = document.getElementById("app");
  R.footer();
  var meetId = new URLSearchParams(location.search).get("m");
  if (!R.configured) { R.renderHeader({}, ""); app.innerHTML = R.setupBanner(); return; }

  R.getContext().then(function (ctx) {
    R.renderHeader(ctx, "meets");
    if (!meetId) { app.innerHTML = '<div class="card"><h2>Meet not found</h2><p>This link is missing its meet code. Please use the full link you were sent.</p></div>'; return; }
    var meetRef = R.db.collection("meets").doc(meetId);
    meetRef.get().then(function (snap) {
      if (!snap.exists) { app.innerHTML = '<div class="card"><h2>Meet not found</h2><p>This sign-up link is not valid. Please check the link you were sent.</p></div>'; return; }
      document.title = "Sign up: " + snap.data().title + " | Riptide Officials";
      render(snap.data());
    }).catch(function () { app.innerHTML = '<div class="msg err">Could not load this meet. Please try again.</div>'; });

    function render(m) {
      var roles = R.parseRoles(m.roles).filter(function (r) { return !/shadow/i.test(r.name); });
      var shadowRoles = roles.filter(function (r) { return !/^meet referee$/i.test(r.name); });
      var sessions = R.lines(m.sessions); if (!sessions.length) sessions = ["All sessions"];
      var detailsUrl = "meet.html?m=" + encodeURIComponent(meetId);
      function checks(name, list) {
        return '<div class="checks">' + list.map(function (r) {
          return '<label class="chk"><input type="checkbox" name="' + name + '" value="' + esc(r.name || r) + '"> ' + esc(r.name || r) + "</label>";
        }).join("") + "</div>";
      }
      app.innerHTML =
        '<p style="margin:0 0 10px"><a href="' + detailsUrl + '">&larr; Meet details</a></p>' +
        '<div class="card"><span class="pill green">Sign up to work</span><h1 style="margin-top:8px">' + esc(m.title) + "</h1>" +
        "<p style=\"margin-bottom:0\"><strong>" + esc(R.fmtRange(m)) + "</strong>" + (m.location ? "<br>" + esc(m.location) : "") + "</p></div>" +
        '<form id="su" novalidate>' +
        '<div class="card"><h2>Your information</h2>' +
        '<label for="su-name">Name</label><input id="su-name" autocomplete="name" required>' +
        '<div class="row2"><div><label for="su-email">Email</label><input id="su-email" type="email" autocomplete="email" required></div>' +
        '<div><label for="su-phone">Phone</label><input id="su-phone" type="tel" autocomplete="tel" required></div></div>' +
        '<label for="su-team">Team / club</label><input id="su-team" placeholder="Riptide">' +
        '<div class="hint" style="margin-bottom:0">Your email and phone are only seen by the officials coordinators.</div></div>' +
        (sessions.length > 1 ? '<div class="card"><h2>Sessions you can work</h2>' + checks("sess", sessions) + "</div>" : "") +
        '<div class="card"><h2>Select everything you are certified in</h2>' + checks("cert", roles) + "</div>" +
        '<div class="card"><h2>Interested in shadowing?</h2><p class="muted small" style="margin-top:0">Choose as many positions as you like.</p>' + checks("shadow", shadowRoles) + "</div>" +
        '<div class="card"><h2>Comments</h2><label for="su-comments" class="muted small" style="font-weight:400">Arriving late, leaving early, or anything else we should know.</label><textarea id="su-comments" rows="3"></textarea></div>' +
        '<div class="btn-row"><button class="btn green" type="submit" id="su-btn">Sign me up</button></div><div id="su-status" role="status"></div></form>';

      var $ = function (id) { return document.getElementById(id); };
      function fillMine() {
        if (!ctx.user) return;
        var p = ctx.profile || {};
        $("su-name").value = p.name || ""; $("su-email").value = p.email || ctx.user.email || ""; $("su-phone").value = p.phone || ""; $("su-team").value = "Riptide";
      }
      fillMine();
      function val(sel) { return Array.prototype.map.call(document.querySelectorAll(sel + ":checked"), function (i) { return i.value; }); }

      $("su").addEventListener("submit", function (e) {
        e.preventDefault();
        var st = $("su-status"), btn = $("su-btn");
        var name = $("su-name").value.trim(), email = $("su-email").value.trim(), phone = $("su-phone").value.trim(),
            team = $("su-team").value.trim(), certified = val('input[name="cert"]'), shadow = val('input[name="shadow"]'),
            session = sessions.length > 1 ? val('input[name="sess"]').join(", ") : sessions[0], comments = $("su-comments").value.trim();
        if (!name || !/^\S+@\S+\.\S+$/.test(email) || !phone) { st.innerHTML = '<div class="msg err">Please fill in your name, a valid email, and your phone number.</div>'; return; }
        if (sessions.length > 1 && !session) { st.innerHTML = '<div class="msg err">Please pick at least one session.</div>'; return; }
        if (!certified.length && !shadow.length) { st.innerHTML = '<div class="msg err">Please select what you are certified in, or what you would like to shadow.</div>'; return; }
        btn.disabled = true; btn.textContent = "Signing up...";
        var id = R.newId(), ts = firebase.firestore.FieldValue.serverTimestamp(), uid = ctx.user ? ctx.user.uid : null;
        var pub = { name: name, team: team, role: (certified.join(", ") || "Shadowing").slice(0, 190), certified: certified, shadow: shadow,
                    session: session.slice(0, 190), uid: uid, createdAt: ts };
        var batch = R.db.batch();
        batch.set(meetRef.collection("signups").doc(id), pub);
        batch.set(meetRef.collection("contacts").doc(id), Object.assign({ email: email, phone: phone, comments: comments.slice(0, 500) }, pub));
        batch.commit().then(function () {
          app.innerHTML = '<div class="card"><span class="pill green">All set</span><h1 style="margin-top:8px">Thank you, ' + esc(name.split(" ")[0]) + '!</h1>' +
            "<p>You're signed up for <strong>" + esc(m.title) + "</strong>. The coordinator will post assignments on the meet page. To make a change, email " +
            '<a href="mailto:' + esc(window.ADMIN_EMAIL) + '">' + esc(window.ADMIN_EMAIL) + '</a>.</p><div class="btn-row"><a class="btn" href="' + detailsUrl + '">See meet details</a></div></div>';
          window.scrollTo(0, 0);
        }).catch(function () {
          st.innerHTML = '<div class="msg err">Sorry, that didn\'t go through. Please try again.</div>';
          btn.disabled = false; btn.textContent = "Sign me up";
        });
      });
    }
  });
})();
</script>
</body>
</html>
