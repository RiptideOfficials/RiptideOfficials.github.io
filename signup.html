<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign-Up | Riptide Officials</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#0a2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Officials">
<link rel="icon" href="assets/img/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main id="app"><div class="card loading">Loading...</div></main>
<div class="footer" id="site-footer"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/app.js"></script>
<script>
/* Public by link: anyone with this page's URL can sign up (no login).
   Names/certifications go in a public-readable doc; email, phone and comments go to an admin-only doc. */
(function () {
  var R = window.Riptide, esc = R.esc, app = document.getElementById("app");
  R.footer();
  var meetId = new URLSearchParams(location.search).get("m");
  if (!R.configured) { R.renderHeader({}, ""); app.innerHTML = R.setupBanner(); return; }

  R.getContext().then(function (ctx) {
    R.renderHeader(ctx, "meets");
    if (!meetId) { app.innerHTML = '<div class="card"><h2>Meet not found</h2><p>This link is missing its meet code. Please use the full link you were sent.</p></div>'; return; }
    var meetRef = R.db.collection("meets").doc(meetId);
    function findKey() {
      var q = new URLSearchParams(location.search).get("e"), ls = null;
      if (q) return Promise.resolve(q);
      try { ls = localStorage.getItem("ro_su_" + meetId); } catch (x) {}
      if (ctx.user) return R.db.collection("users").doc(ctx.user.uid).collection("mysignups").doc(meetId).get()
        .then(function (sn) { return sn.exists ? sn.data().key : ls; }).catch(function () { return ls; });
      return Promise.resolve(ls);
    }
    meetRef.get().then(function (snap) {
      if (!snap.exists) { app.innerHTML = '<div class="card"><h2>Meet not found</h2><p>This sign-up link is not valid. Please check the link you were sent.</p></div>'; return; }
      document.title = "Sign up: " + snap.data().title + " | Riptide Officials";
      return findKey().then(function (key) {
        if (!key) return render(snap.data(), null, null);
        return meetRef.collection("contacts").doc(key).get().then(function (c) {
          if (c.exists) render(snap.data(), key, c.data()); else render(snap.data(), null, null, !!new URLSearchParams(location.search).get("e"));
        }).catch(function () { render(snap.data(), null, null); });
      });
    }).catch(function () { app.innerHTML = '<div class="msg err">Could not load this meet. Please try again.</div>'; });

    function render(m, key, ex, badLink) {
      var editing = !!key; ex = ex || {};
      var roles = R.parseRoles(m.roles).filter(function (r) { return !/shadow/i.test(r.name); });
      var shadowRoles = roles.filter(function (r) { return !/^meet referee$/i.test(r.name); });
      var sessions = R.lines(m.sessions); if (!sessions.length) sessions = ["All sessions"];
      var detailsUrl = "meet.html?m=" + encodeURIComponent(meetId);
      function has(list, v) { return (Array.isArray(list) ? list : []).indexOf(v) >= 0; }
      function checks(name, list, chosen) {
        return '<div class="checks">' + list.map(function (r) {
          var v = r.name || r;
          return '<label class="chk"><input type="checkbox" name="' + name + '" value="' + esc(v) + '"' + (has(chosen, v) ? " checked" : "") + "> " + esc(v) + "</label>";
        }).join("") + "</div>";
      }
      var chosenSess = String(ex.session || "").split(", ");
      app.innerHTML =
        '<p style="margin:0 0 10px"><a href="' + detailsUrl + '">&larr; Meet details</a></p>' +
        '<div class="card"><span class="pill green">' + (editing ? "Your sign-up" : "Sign up to work") + '</span><h1 style="margin-top:8px">' + esc(m.title) + "</h1>" +
        "<p style=\"margin-bottom:0\"><strong>" + esc(R.fmtRange(m)) + "</strong>" + (m.location ? "<br>" + esc(m.location) : "") + "</p></div>" +
        (editing ? '<div class="msg info">You already signed up for this meet. Make your changes below and tap <strong>Save changes</strong>.</div>' : "") +
        (badLink ? '<div class="msg err">That edit link did not work, so you can sign up again below.</div>' : "") +
        '<form id="su" novalidate>' +
        '<div class="card"><h2>Your information</h2>' +
        '<label for="su-name">Name</label><input id="su-name" autocomplete="name" required>' +
        '<div class="row2"><div><label for="su-email">Email</label><input id="su-email" type="email" autocomplete="email" required></div>' +
        '<div><label for="su-phone">Phone</label><input id="su-phone" type="tel" autocomplete="tel" required></div></div>' +
        '<label for="su-team">Team / club</label><input id="su-team" placeholder="Riptide">' +
        '<div class="hint" style="margin-bottom:0">Your email and phone are only seen by the officials coordinators.</div></div>' +
        (sessions.length > 1 ? '<div class="card"><h2>Sessions you can work</h2>' + checks("sess", sessions, chosenSess) + "</div>" : "") +
        '<div class="card"><h2>Select everything you are certified in</h2>' + checks("cert", roles, ex.certified) + "</div>" +
        '<div class="card"><h2>Interested in shadowing?</h2><p class="muted small" style="margin-top:0">Choose as many positions as you like.</p>' + checks("shadow", shadowRoles, ex.shadow) + "</div>" +
        '<div class="card"><h2>Comments</h2><label for="su-comments" class="muted small" style="font-weight:400">Arriving late, leaving early, or anything else we should know.</label><textarea id="su-comments" rows="3"></textarea></div>' +
        '<div class="btn-row"><button class="btn green" type="submit" id="su-btn">' + (editing ? "Save changes" : "Sign me up") + "</button>" +
        (editing ? '<button class="btn danger" type="button" id="su-cancel">Cancel my sign-up</button>' : "") + '</div><div id="su-status" role="status"></div></form>';

      var $ = function (id) { return document.getElementById(id); };
      function fillMine() {
        if (editing) {
          $("su-name").value = ex.name || ""; $("su-email").value = ex.email || ""; $("su-phone").value = ex.phone || "";
          $("su-team").value = ex.team || ""; $("su-comments").value = ex.comments || "";
          return;
        }
        if (!ctx.user) return;
        var p = ctx.profile || {};
        $("su-name").value = p.name || ""; $("su-email").value = p.email || ctx.user.email || ""; $("su-phone").value = p.phone || ""; $("su-team").value = "Riptide";
      }
      fillMine();
      function val(sel) { return Array.prototype.map.call(document.querySelectorAll(sel + ":checked"), function (i) { return i.value; }); }

      $("su").addEventListener("submit", function (e) {
        e.preventDefault();
        var st = $("su-status"), btn = $("su-btn");
        var name = $("su-name").value.trim(), email = $("su-email").value.trim(), phone = $("su-phone").value.trim(),
            team = $("su-team").value.trim(), certified = val('input[name="cert"]'), shadow = val('input[name="shadow"]'),
            session = sessions.length > 1 ? val('input[name="sess"]').join(", ") : sessions[0], comments = $("su-comments").value.trim();
        if (!name || !/^\S+@\S+\.\S+$/.test(email) || !phone) { st.innerHTML = '<div class="msg err">Please fill in your name, a valid email, and your phone number.</div>'; return; }
        if (sessions.length > 1 && !session) { st.innerHTML = '<div class="msg err">Please pick at least one session.</div>'; return; }
        if (!certified.length && !shadow.length) { st.innerHTML = '<div class="msg err">Please select what you are certified in, or what you would like to shadow.</div>'; return; }
        btn.disabled = true; btn.textContent = "Saving...";
        var data = { name: name, team: team, role: (certified.join(", ") || "Shadowing").slice(0, 190), certified: certified, shadow: shadow,
                     session: session.slice(0, 190), email: email, phone: phone, comments: comments.slice(0, 500) };
        var k = key || R.newId(), ref = meetRef.collection("contacts").doc(k), p;
        if (editing) p = ref.update(data);
        else {
          data.uid = ctx.user ? ctx.user.uid : null; data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          p = ref.set(data);
        }
        p.then(function () {
          try { localStorage.setItem("ro_su_" + meetId, k); } catch (x) {}
          if (ctx.user) R.db.collection("users").doc(ctx.user.uid).collection("mysignups").doc(meetId).set({ key: k }).catch(function () {});
          var link = location.href.split("#")[0].split("?")[0] + "?m=" + encodeURIComponent(meetId) + "&e=" + encodeURIComponent(k);
          var mail = "mailto:" + encodeURIComponent(email) + "?subject=" + encodeURIComponent("Your sign-up for " + m.title) +
            "&body=" + encodeURIComponent("Use this private link any time to change or cancel your sign-up for " + m.title + ":\n\n" + link);
          app.innerHTML = '<div class="card"><span class="pill green">' + (editing ? "Saved" : "All set") + '</span><h1 style="margin-top:8px">' +
            (editing ? "Your changes are saved" : "Thank you, " + esc(name.split(" ")[0]) + "!") + "</h1>" +
            "<p>You're signed up for <strong>" + esc(m.title) + "</strong>. The coordinator will post assignments on the meet page.</p>" +
            "<h3>Need to change something later?</h3><p>Come back to this meet's sign-up page on this phone or computer and your sign-up will open for editing" +
            (ctx.user ? " (it is also saved to your account)" : "") + ". To open it anywhere else, save your private link:</p>" +
            '<div class="btn-row"><button class="btn" type="button" id="cp">Copy my edit link</button><a class="btn ghost" href="' + mail + '">Email me my edit link</a>' +
            '<a class="btn ghost" href="' + detailsUrl + '">See meet details</a></div></div>';
          $("cp").onclick = function () { R.copyText(link).then(function () { $("cp").textContent = "Copied!"; }); };
          window.scrollTo(0, 0);
        }).catch(function () {
          st.innerHTML = '<div class="msg err">Sorry, that didn\'t go through. Please try again.</div>';
          btn.disabled = false; btn.textContent = editing ? "Save changes" : "Sign me up";
        });
      });
      var cancel = $("su-cancel");
      if (cancel) cancel.onclick = function () {
        if (!confirm("Cancel your sign-up for this meet?")) return;
        meetRef.collection("contacts").doc(key).delete().then(function () {
          try { localStorage.removeItem("ro_su_" + meetId); } catch (x) {}
          if (ctx.user) R.db.collection("users").doc(ctx.user.uid).collection("mysignups").doc(meetId).delete().catch(function () {});
          app.innerHTML = '<div class="card"><h1>Your sign-up was cancelled</h1><p>You can sign up again any time from the meet page.</p><div class="btn-row"><a class="btn" href="' + detailsUrl + '">Meet details</a></div></div>';
        }).catch(function () { $("su-status").innerHTML = '<div class="msg err">Could not cancel. Please try again.</div>'; });
      };
    }
  });
})();
</script>
</body>
</html>
