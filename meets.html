<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meet Sign-Ups | Riptide Officials</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#0a2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Officials">
<link rel="icon" href="assets/img/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main id="app"><div class="card loading">Loading...</div></main>
<div class="footer" id="site-footer"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  var R = window.Riptide, esc = R.esc;
  R.footer();
  R.requireMember("meets").then(function (ctx) {
    if (!ctx) return;
    var app = document.getElementById("app");
    app.innerHTML = "<h1>Meet sign-ups</h1>" +
      (ctx.isAdmin ? '<div class="btn-row" style="margin:0 0 14px"><a class="btn coord" href="meet-edit.html">Add a meet</a></div>' : "") +
      '<div class="card"><h2>Upcoming</h2><ul class="meet-list" id="up"><li class="muted">Loading...</li></ul></div>' +
      '<div class="card"><h2>Past meets</h2><ul class="meet-list" id="past"></ul></div>';
    var now = new Date(), key = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
    R.db.collection("meets").orderBy("date").get().then(function (snap) {
      var meets = snap.docs.map(function (d) { var m = d.data(); m.id = d.id; return m; });
      function row(m) {
        return "<li><div><strong>" + esc(m.title) + "</strong><br><span class=\"muted small\">" + esc(R.fmtRange(m)) +
          (m.location ? " &middot; " + esc(m.location) : "") + "</span></div><div class=\"btn-row\" style=\"margin:0\">" +
          (ctx.isAdmin ? '<a class="btn small coord" href="assignments.html?m=' + encodeURIComponent(m.id) + '">Assignments</a><button class="btn small coord" data-copy="' + esc(m.id) + '">Copy link</button>' : "") +
          '<a class="btn small" href="meet.html?m=' + encodeURIComponent(m.id) + '">Open</a></div></li>';
      }
      var up = meets.filter(function (m) { return (m.endDate || m.date) >= key; });
      var past = meets.filter(function (m) { return (m.endDate || m.date) < key; }).reverse();
      document.getElementById("up").innerHTML = up.length ? up.map(row).join("") : '<li class="muted">No upcoming meets yet.</li>';
      document.getElementById("past").innerHTML = past.length ? past.map(row).join("") : '<li class="muted">None.</li>';
      app.addEventListener("click", function (e) {
        var id = e.target.getAttribute && e.target.getAttribute("data-copy");
        if (!id) return;
        R.copyText(R.meetUrl(id)).then(function () { e.target.textContent = "Copied!"; setTimeout(function () { e.target.textContent = "Copy link"; }, 1500); });
      });
    }).catch(function () {
      document.getElementById("up").innerHTML = '<li><div class="msg err">Could not load meets.</div></li>';
    });
  });
})();
</script>
</body>
</html>
