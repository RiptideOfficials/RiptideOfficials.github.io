<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meet setup | Riptide Officials</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#0a2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Officials">
<link rel="icon" href="assets/img/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main id="app"><div class="card loading">Loading...</div></main>
<div class="footer" id="site-footer"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  var R = window.Riptide, esc = R.esc, $ = function (id) { return document.getElementById(id); };
  R.footer();
  var meetId = new URLSearchParams(location.search).get("m");

  R.requireAdmin("admin").then(function (ctx) {
    if (!ctx) return;
    var app = $("app"), S = [], whole = R.WHOLE_POS.slice(), legacy = false;

    var DKEYS = [["Warm-ups", "warm", /warm/i], ["Officials meeting", "off", /official/i], ["Timers meeting", "timers", /timer(?!.*(led|run) by)/i], ["Timers meeting led by", "timersby", /(led|run) by/i], ["Meet starts", "start", /start/i]];
    // time boxes: warm, off, timers, start use a time picker (stored as "7:30 AM"); older typed text is converted when it can be
    var TIMEKEYS = ["warm", "off", "timers", "start"];
    function toHHMM(v) {
      v = String(v || "").trim(); if (!v) return "";
      var m = /^(\d{1,2})(?::?(\d{2}))?\s*([ap])\.?\s*m?\.?$/i.exec(v) || /^(\d{1,2}):(\d{2})$/.exec(v);
      if (!m) return null;
      var h = +m[1], mi = m[2] ? +m[2] : 0, ap = (m[3] || "").toLowerCase();
      if (ap === "p" && h < 12) h += 12; if (ap === "a" && h === 12) h = 0;
      if (h > 23 || mi > 59) return null;
      return String(h).padStart(2, "0") + ":" + String(mi).padStart(2, "0");
    }
    function parseDetails(text) {   // "Label | time" lines -> the four boxes (+ any other lines kept as they are)
      var dv = {}, extra = [];
      R.parseSchedule(text).forEach(function (l) {
        var k = DKEYS.filter(function (d) { return d[2].test(l.label) && dv[d[1]] == null; })[0];
        if (k) dv[k[1]] = l.value; else extra.push(l.label + (l.value ? " | " + l.value : ""));
      });
      return { dv: dv, extra: extra.join("\n") };
    }
    function buildDetails(x) {
      var lines = DKEYS.filter(function (d) { return (x.dv[d[1]] || "").trim(); }).map(function (d) { var v = x.dv[d[1]].trim(); if (TIMEKEYS.indexOf(d[1]) >= 0 && /^\d{2}:\d{2}$/.test(v)) v = R.fmtTime(v); return d[0] + " | " + v; });
      if (x.extra) lines.push(x.extra);
      return lines.join("\n");
    }
    function blankSession(i) { return { name: "", date: $("m-date") ? $("m-date").value : "", start: "", positions: R.SESSION_POS.slice(), shadow: R.SESSION_POS.slice(), dv: {}, extra: "", notes: "" }; }
    var U = {};   // meet uniform text by date

    function load() {
      if (!meetId) return Promise.resolve({ data: {}, norm: null });
      return R.db.collection("meets").doc(meetId).get().then(function (snap) {
        if (!snap.exists) throw new Error("missing");
        var m = snap.data();
        return { data: m, norm: R.normMeet(m) };
      });
    }

    load().then(function (r) { draw(r.data, r.norm); }).catch(function () {
      app.innerHTML = '<div class="card coord-card"><h2>Meet not found</h2><p><a href="admin.html">Back to Admin</a></p></div>';
    });

    function draw(m, n) {
      var info = n ? n.info : {};
      if (n && !n.v2) { // older meet: sort its text into the new boxes
        legacy = true;
        var lines = String(m.notes || "").split(/\r?\n/).map(function (x) { return x.trim(); }).filter(Boolean), uni = "", rest = lines;
        if (lines.length && /uniform/i.test(lines[0])) { uni = lines.slice(1).join("\n"); rest = []; }
        info = { parking: "", uniform: uni, food: "", misc: rest.join("\n") };
        n.sessions.forEach(function (x, i) { if (i === 0) x.details = m.schedule || ""; });
      }
      S = n ? n.sessions.map(function (x, i) { var p = parseDetails(x.details); return Object.assign({}, x, { dv: p.dv, extra: p.extra, name: (n.v2 && x.name !== "Session " + (i + 1)) ? x.name : "" }); }) : [];
      if (n) whole = n.whole.slice();
      app.innerHTML =
        '<p style="margin:0 0 10px"><a href="admin.html">&larr; Admin</a></p>' +
        "<h1>" + (meetId ? "Edit meet" : "Add a meet") + "</h1>" +
        (legacy ? '<div class="msg info">This meet was set up the older way. Its notes and times were copied into <strong>Miscellaneous</strong>. Sort them into the right boxes, then save.</div>' : "") +
        '<form id="mf" novalidate>' +
        '<div class="card coord-card"><h2>Meet</h2>' +
        '<label for="m-title">Meet name</label><input id="m-title" placeholder="Jingle Bell Invite">' +
        '<div class="row2"><div><label for="m-date">First day</label><input id="m-date" type="date"></div>' +
        '<div><label for="m-end">Last day (if more than one day)</label><input id="m-end" type="date"></div></div>' +
        '<label for="m-loc">Location</label><input id="m-loc" placeholder="Pool name and address"></div>' +
        '<div class="card coord-card"><h2>All sessions</h2><p class="muted small" style="margin-top:0">These positions cover all sessions, so people choose them once.</p>' +
        '<div class="checks" id="whole">' + R.WHOLE_POS.map(function (p) {
          return '<label class="chk"><input type="checkbox" data-whole="' + esc(p) + '"' + (whole.indexOf(p) >= 0 ? " checked" : "") + "> " + esc(p) + "</label>";
        }).join("") + "</div></div>" +
        '<div id="sess"></div>' +
        '<div class="btn-row" style="margin:0 0 16px"><button class="btn coord" type="button" id="add-sess">+ Add another session</button></div>' +
        '<div class="card coord-card"><h2>Information for officials</h2><p class="muted small" style="margin-top:0">Each box becomes its own section on the meet page. Leave a box empty to hide it.</p>' +
        '<label for="i-parking">Parking</label><textarea id="i-parking" rows="3"></textarea>' +
        '<label>Meet uniform</label><div id="uni"></div>' +
        '<label for="i-food">Food</label><textarea id="i-food" rows="3"></textarea>' +
        '<label for="i-misc">Miscellaneous</label><textarea id="i-misc" rows="3"></textarea></div>' +
        '<div class="btn-row"><button class="btn green" type="submit" id="m-save">Save meet</button><a class="btn ghost" href="admin.html">Cancel</a></div>' +
        '<div id="m-status" role="status"></div></form>';
      $("m-title").value = m.title || ""; $("m-date").value = m.date || ""; $("m-end").value = m.endDate || ""; $("m-loc").value = m.location || "";
      $("i-parking").value = info.parking || ""; (function () {
        U = {};
        (info.uniformByDate || []).forEach(function (d) { U[d.date] = d.text || ""; });
        U["*"] = info.uniform || "";   // older single text: used for every day without its own
      })();
      drawUniform(); $("i-food").value = info.food || ""; $("i-misc").value = info.misc || "";
      if (!S.length) S.push(blankSession(0));
      drawSessions();

      $("m-date").addEventListener("change", function () { drawUniform(); if (S.length === 1) drawSessions(); }); $("m-end").addEventListener("change", drawUniform);
      $("uni").addEventListener("input", function (ev) { var d = ev.target.getAttribute("data-uni"); if (d) U[d] = ev.target.value; });
      $("add-sess").onclick = function () { S.push(blankSession(S.length)); drawSessions(); };
      $("whole").addEventListener("change", function () {
        whole = Array.prototype.map.call($("whole").querySelectorAll("input:checked"), function (i) { return i.getAttribute("data-whole"); });
      });
      $("sess").addEventListener("input", function (e) {
        var t = e.target, i = t.getAttribute("data-i"), f = t.getAttribute("data-f"), dk = t.getAttribute("data-dv");
        if (i != null && f) S[+i][f] = t.value;
        else if (i != null && dk) S[+i].dv[dk] = t.value;
      });
      $("sess").addEventListener("change", function (e) {
        var t = e.target, i = t.getAttribute("data-i"), f = t.getAttribute("data-list");
        if (i == null || !f) return;
        S[+i][f] = Array.prototype.map.call(document.querySelectorAll('#sess input[data-i="' + i + '"][data-list="' + f + '"]:checked'), function (x) { return x.value; });
      });
      $("sess").addEventListener("click", function (e) {
        var i = e.target.getAttribute && e.target.getAttribute("data-remove");
        if (i == null) return;
        if (S.length === 1) { alert("A meet needs at least one session."); return; }
        if (!confirm("Remove this session?")) return;
        S.splice(+i, 1); drawSessions();
      });
      $("mf").addEventListener("submit", save);
    }

    function days() {
      var a = $("m-date").value, b = $("m-end").value || a, out = [];
      if (!a) return out;
      var d = new Date(a + "T00:00:00"), end = new Date(b + "T00:00:00");
      for (var i = 0; i < 14 && d <= end; i++) { out.push(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0")); d.setDate(d.getDate() + 1); }
      return out;
    }
    function drawUniform() {
      var list = days(), el = $("uni");
      if (!list.length) { el.innerHTML = '<p class="muted small">Pick the meet dates above, then enter the uniform for each day.</p>'; return; }
      el.innerHTML = list.map(function (d) {
        var txt = U[d] != null && U[d] !== "" ? U[d] : (U["*"] || "");
        U[d] = txt;
        return '<label class="muted small" style="font-weight:600">' + (list.length > 1 ? esc(R.fmtDate(d)) : "All day") + '</label><textarea rows="2" data-uni="' + d + '">' + esc(txt) + "</textarea>";
      }).join("");
    }

    function drawSessions() {
      $("sess").innerHTML = S.map(function (x, i) {
        function checks(list, chosen) {
          return '<div class="checks">' + R.SESSION_POS.map(function (p) {
            return '<label class="chk"><input type="checkbox" data-i="' + i + '" data-list="' + list + '" value="' + esc(p) + '"' + (chosen.indexOf(p) >= 0 ? " checked" : "") + "> " + esc(p) + "</label>";
          }).join("") + "</div>";
        }
        return '<div class="card coord-card"><h2>' + esc(x.name || (S.length === 1 ? ((x.date || ($("m-date") && $("m-date").value)) ? new Date((x.date || $("m-date").value) + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" }) : "Session details") : "Session " + (i + 1))) + "</h2>" +
          '<label>Session name (optional)</label><input data-i="' + i + '" data-f="name" placeholder="' + (S.length === 1 ? "Leave blank \u2014 only one session" : "Session " + (i + 1)) + '" value="' + esc(x.name) + '">' +
          '<div class="row2"><div><label>Date</label><input type="date" data-i="' + i + '" data-f="date" value="' + esc(x.date) + '"></div>' +
          '<div><label>Start time</label><input type="time" data-i="' + i + '" data-f="start" value="' + esc(x.start) + '"></div></div>' +
          "<label>Positions people can sign up for in this session</label>" + checks("positions", x.positions) +
          "<label>Positions people can ask to shadow in this session</label>" + checks("shadow", x.shadow) +
          "<label>Meet details</label>" + '<div class="row2">' + DKEYS.map(function (d) {
            var isT = TIMEKEYS.indexOf(d[1]) >= 0, cur = x.dv[d[1]] || "", hm = isT ? toHHMM(cur) : null;
            if (isT && hm !== null) { x.dv[d[1]] = hm; cur = hm; }
            var typ = isT && hm !== null ? ' type="time"' : "";
            return '<div><label class="muted small" style="font-weight:600">' + d[0] + '</label><input' + typ + ' data-i="' + i + '" data-dv="' + d[1] + '" placeholder="' + (d[1] === "timersby" ? "Name (add when known)" : "Time") + '" value="' + esc(cur) + '"></div>';
          }).join("") + "</div>" +
          '<label>Notes for officials</label><textarea rows="3" data-i="' + i + '" data-f="notes" placeholder="Warm-ups, officials meeting, timers meeting...">' + esc(x.notes) + "</textarea>" +
          (S.length > 1 ? '<div class="btn-row"><button class="btn small danger" type="button" data-remove="' + i + '">Remove this session</button></div>' : "") + "</div>";
      }).join("");
    }

    function save(e) {
      e.preventDefault();
      var st = $("m-status"), title = $("m-title").value.trim(), date = $("m-date").value, end = $("m-end").value;
      if (!title || !date) { st.innerHTML = '<div class="msg err">Please enter a meet name and the first day.</div>'; return; }
      if (end && end < date) { st.innerHTML = '<div class="msg err">The last day is before the first day.</div>'; return; }
      var FV = firebase.firestore.FieldValue;
      var data = {
        title: title, date: date, endDate: end || "", location: $("m-loc").value.trim(),
        wholeMeet: whole.slice(),
        sessionList: S.map(function (x, i) { return { name: (x.name || "").trim(), date: x.date || "", start: x.start || "",
          positions: x.positions || [], shadow: x.shadow || [], details: buildDetails(x), notes: (x.notes || "").trim() }; }),
        info: { parking: $("i-parking").value.trim(), uniform: "", uniformByDate: days().map(function (d) { return { date: d, text: (U[d] || "").trim() }; }).filter(function (d) { return d.text; }), food: $("i-food").value.trim(), misc: $("i-misc").value.trim() }
      };
      data.sessions = data.sessionList.map(function (x, i) { return x.name || "Session " + (i + 1); }).join("\n");
      var ref = meetId ? R.db.collection("meets").doc(meetId) : R.db.collection("meets").doc(R.newId());
      if (!meetId) data.createdAt = FV.serverTimestamp();
      else { data.roles = FV.delete(); data.schedule = FV.delete(); data.notes = FV.delete(); }
      $("m-save").disabled = true;
      ref.set(data, { merge: true }).then(function () {
        location.href = "meet.html?m=" + encodeURIComponent(ref.id);
      }).catch(function () {
        st.innerHTML = '<div class="msg err">Could not save. Make sure you are signed in with your verified admin email.</div>';
        $("m-save").disabled = false;
      });
    }
  });
})();
</script>
</body>
</html>
