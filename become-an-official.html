  <h1>Become a USA Swimming Stroke &amp; Turn official</h1>
  <p class="muted">For Riptide Swim Team. Make a splash: join our officiating team.</p>
  <div class="btn-row">
    <a class="btn small ghost" href="docs/training/Become_a_Stroke_and_Turn_Official_Flyer.docx" download>Download as Word</a>
    <button class="btn small ghost" type="button" data-print>Print</button>
    
  </div>

<div class="card">
  <p>Do you want to support young athletes and be part of the action on deck? Becoming a USA Swimming Stroke &amp; Turn Official for Riptide Swim Team is a rewarding way to get involved, make a positive impact, and ensure fair and fun competitions.</p>
</div>
<div class="grid two">
  <section class="card"><h2>Why join as an official?</h2>
    <ul>
      <li><strong>Front-row action:</strong> experience every race up close and be part of the energy and excitement.</li>
      <li><strong>Support young athletes:</strong> help ensure that swimmers have a fair and encouraging environment to compete and achieve their best.</li>
      <li><strong>Personal growth:</strong> gain valuable knowledge about competitive swimming and develop leadership and communication skills.</li>
      <li><strong>Community connection:</strong> be part of a supportive, dedicated group of volunteers and make lasting friendships.</li>
    </ul></section>
  <section class="card"><h2>How to become certified</h2>
    <ul>
      <li><strong>Complete USA Swimming membership:</strong> register as an Official with USA Swimming, including a background check, concussion training, and Athlete Protection Training.</li>
      <li><strong>Complete Stroke and Turn online training and Foundations of Officiating:</strong> learn the rules of competitive swimming and how to officiate with confidence.</li>
      <li><strong>On-the-job training:</strong> shadow experienced officials at swim meets to gain hands-on experience.</li>
    </ul>
    <p><a class="btn small" href="how-to.html">Start the step-by-step checklist</a></p></section>
</div>
<section class="card"><h2>Join us today!</h2>
  <p>Ready to dive in? Becoming a Stroke &amp; Turn Official is easier than you think and incredibly rewarding. No prior swimming experience is required, just your enthusiasm and dedication to helping every swimmer shine.</p>
  <p>We are looking for passionate volunteers like YOU to ensure our swim meets run smoothly. Rest assured, we will be with you every step of the way!</p>
  <p>Curious but not ready to commit? Contact Wendy Peterson to arrange a shadow session at a Riptide-hosted swim meet and see firsthand how you can make a difference!</p>
  <p><strong>Wendy Peterson</strong>, Riptide Officials Coordinator<br><a href="mailto:whpeterson@gmail.com">whpeterson@gmail.com</a> &middot; <a href="tel:+16127087227">612-708-7227</a></p>
</section>
