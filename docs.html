<script>
(function () {
  var R = window.Riptide;
  R.footer();
  if (location.hash === "#apparel") { location.replace("apparel.html"); return; }   // Apparel has its own page now
  R.requireMember("docs").then(function (ctx) {
    if (!ctx) return;
    var app = document.getElementById("app");
    app.innerHTML = "";
    app.appendChild(document.getElementById("docs-content").content.cloneNode(true));
    R.db.collection("private").doc("team").get().then(function (snap) {
      var link = snap.exists ? snap.data().registrationLink : "";
      var body = document.getElementById("team-link-body");
      if (link && /^https:\/\/omr\.usaswimming\.org\//.test(link)) {
        body.innerHTML = '<a class="btn small" href="' + R.esc(link) + '" target="_blank" rel="noopener">Open USA Swimming registration</a>' +
          '<span class="hint" style="display:block">Use this link to register with Riptide as your team. Please don\'t share it outside the team.</span>';
      } else {
        body.textContent = "The coordinator hasn't added the link yet. Email " + window.ADMIN_EMAIL + ".";
      }
    }).catch(function () { document.getElementById("team-link-body").textContent = "Could not load the link."; });
    R.docTabs(app); R.Edit.run(app, ctx, "docs").catch(function () {});
  });
})();
</script>
