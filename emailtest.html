<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Email test | Riptide Officials</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/firebase-config.js"></script></head>
<body><main id="app">
<div class="card"><h1>Email test</h1>
<p class="muted">Sends one test message through FormSubmit and shows exactly what FormSubmit answered. Take a screenshot of the result.</p>
<div class="btn-row"><button class="btn green" id="t1">Test using the form ID</button><button class="btn ghost" id="t2">Test using the email address</button></div>
<pre id="out" style="white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid #ccd;padding:12px;border-radius:10px;margin-top:12px">Nothing sent yet.</pre></div>
</main>
<script>
function send(id, label) {
  var out = document.getElementById("out"); out.textContent = "Sending (" + label + ")...";
  var t0 = Date.now();
  fetch("https://formsubmit.co/ajax/" + encodeURIComponent(id), {
    method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify({ name: "Email test (" + label + ")", message: "Test sent " + new Date().toLocaleString() + " from the site's email test page.", _subject: "Riptide Officials: email test (" + label + ")", _template: "table", _captcha: "false" })
  }).then(function (r) { return r.text().then(function (t) { out.textContent = label + "\nHTTP " + r.status + " after " + (Date.now() - t0) + " ms\n\n" + t; }); })
    .catch(function (e) { out.textContent = label + "\nFAILED to reach FormSubmit:\n" + e; });
}
document.getElementById("t1").onclick = function () { send(window.FORMSUBMIT_ID, "form ID"); };
document.getElementById("t2").onclick = function () { send(window.INTEREST_FORM_EMAIL, "email address"); };
</script></body></html>
