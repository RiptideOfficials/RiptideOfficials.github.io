<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Meet | Riptide Officials</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#0a2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Officials">
<link rel="icon" href="assets/img/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main id="app"><div class="card loading">Loading...</div></main>
<div class="footer" id="site-footer"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/app.js"></script>
<script>
/* Public by link: anyone with this page's URL can view the meet details and assignments (no login). */
(function () {
  var R = window.Riptide, esc = R.esc, app = document.getElementById("app");
  R.footer();
  var meetId = new URLSearchParams(location.search).get("m");
  if (!R.configured) { R.renderHeader({}, ""); app.innerHTML = R.setupBanner(); return; }

  R.getContext().then(function (ctx) {
    R.renderHeader(ctx, "meets");
    if (!meetId) { app.innerHTML = '<div class="card"><h2>Meet not found</h2><p>This link is missing its meet code. Please use the full link you were sent.</p></div>'; return; }
    R.db.collection("meets").doc(meetId).get().then(function (snap) {
      if (!snap.exists) { app.innerHTML = '<div class="card"><h2>Meet not found</h2><p>This link is not valid. Please check the link you were sent.</p></div>'; return; }
      document.title = snap.data().title + " | Riptide Officials";
      render(snap.data());
    }).catch(function () { app.innerHTML = '<div class="msg err">Could not load this meet. Please try again.</div>'; });

    function notesHtml(t) {
      var L = String(t || "").split(/\r?\n/).map(function (x) { return x.trim(); }), out = "";
      for (var i = 0; i < L.length; i++) {
        if (!L[i]) continue;
        var nx = ""; for (var j = i + 1; j < L.length; j++) if (L[j]) { nx = L[j]; break; }
        if (L[i].length <= 40 && !/[.!?:]$/.test(L[i]) && nx.length > L[i].length) out += '<h3 class="note-h">' + esc(L[i]) + "</h3>";
        else out += '<p class="note-p">' + esc(L[i]) + "</p>";
      }
      return out;
    }

    function render(m) {
      var sched = R.parseSchedule(m.schedule), a = m.assignments || {};
      var url = R.meetUrl(meetId), signupUrl = "signup.html?m=" + encodeURIComponent(meetId);
      var html = '<div class="card"><span class="pill green">Riptide hosted meet</span>' +
        '<h1 style="margin-top:8px">' + esc(m.title) + "</h1>" +
        '<div class="meet-when"><span class="when">' + esc(R.fmtRange(m)) + "</span>" + (m.location ? '<span class="where">' + esc(m.location) + "</span>" : "") + "</div>" +
        notesHtml(m.notes) +
        '<div class="btn-row"><a class="btn green" href="' + signupUrl + '">Sign up to work</a>' +
        '<button class="btn ghost" type="button" id="cal-btn">Add to calendar</button>' +
        (ctx.isAdmin ? '<a class="btn small ghost" href="admin.html?edit=' + encodeURIComponent(meetId) + '">Edit meet details</a>' +
          '<a class="btn small ghost" href="' + signupUrl + '#assign">Assign positions</a>' +
          '<button class="btn small ghost" type="button" id="copylink">Copy link</button>' : "") + "</div>" +
        '<div id="cal-opts" class="btn-row hidden">' +
        '<a class="btn small" target="_blank" rel="noopener" href="' + esc(R.googleCalUrl(m, url)) + '">Google Calendar</a>' +
        '<a class="btn small" download="' + esc(m.title.replace(/[^\w]+/g, "-")) + '.ics" href="' + R.icsHref(m, meetId, url) + '">Apple / Outlook (.ics)</a></div></div>';

      if (sched.length) {
        html += '<div class="card"><h2>Meet details</h2><table class="sched">' + sched.map(function (s) {
          return "<tr><td>" + esc(s.label) + "</td><td>" + esc(s.value) + "</td></tr>"; }).join("") + "</table></div>";
      }
      var any = R.ASSIGN_GROUPS.some(function (g) { return (a[g.key] || []).length; });
      html += '<div class="card" id="assignments"><h2>Meet assignments</h2>';
      if (!any) html += '<p class="muted">Assignments will be posted here once the coordinator has filled them in.</p>';
      else html += '<div class="asg-cols">' + R.ASSIGN_GROUPS.map(function (g) {
        var list = a[g.key] || []; if (!list.length) return "";
        return '<div class="asg-show"><h3>' + esc(g.label) + "</h3><ul>" + list.map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("") + "</ul></div>";
      }).join("") + "</div>";
      html += "</div>";
      app.innerHTML = html;

      document.getElementById("cal-btn").onclick = function () { document.getElementById("cal-opts").classList.toggle("hidden"); };
      var cl = document.getElementById("copylink");
      if (cl) cl.onclick = function () { R.copyText(url).then(function () { cl.textContent = "Copied!"; setTimeout(function () { cl.textContent = "Copy link"; }, 1500); }); };
    }
  });
})();
</script>
</body>
</html>
