<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Meet | Riptide Officials</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#0a2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Officials">
<link rel="icon" href="assets/img/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main id="app"><div class="card loading">Loading...</div></main>
<div class="footer" id="site-footer"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/app.js"></script>
<script>
/* Public by link: anyone with this page's URL can view the meet details and assignments (no login). */
(function () {
  var R = window.Riptide, esc = R.esc, app = document.getElementById("app");
  R.footer();
  var meetId = new URLSearchParams(location.search).get("m");
  if (!R.configured) { R.renderHeader({}, ""); app.innerHTML = R.setupBanner(); return; }

  R.getContext().then(function (ctx) {
    R.renderHeader(ctx, "meets");
    if (!meetId) { app.innerHTML = '<div class="card"><h2>Meet not found</h2><p>This link is missing its meet code. Please use the full link you were sent.</p></div>'; return; }
    var meetRef = R.db.collection("meets").doc(meetId);
    meetRef.get().then(function (snap) {
      if (!snap.exists) { app.innerHTML = '<div class="card"><h2>Meet not found</h2><p>This link is not valid. Please check the link you were sent.</p></div>'; return; }
      document.title = snap.data().title + " | Riptide Officials";
      return meetRef.collection("whole").get().then(function (cs) { var c = {}; cs.docs.forEach(function (d) { c[d.id] = d.data().name; }); return c; })
        .catch(function () { return {}; }).then(function (claims) { render(snap.data(), claims); });
    }).catch(function () { app.innerHTML = '<div class="msg err">Could not load this meet. Please try again.</div>'; });

    function paras(t) {
      return String(t || "").split(/\r?\n/).map(function (x) { return x.trim(); }).filter(Boolean).map(function (x) { return '<p class="note-p">' + esc(x) + "</p>"; }).join("");
    }
    function notesHtml(t) {   // older meets: a short first line is treated as a heading
      var L = String(t || "").split(/\r?\n/).map(function (x) { return x.trim(); }), out = "";
      for (var i = 0; i < L.length; i++) {
        if (!L[i]) continue;
        var nx = ""; for (var j = i + 1; j < L.length; j++) if (L[j]) { nx = L[j]; break; }
        if (L[i].length <= 40 && !/[.!?:]$/.test(L[i]) && nx.length > L[i].length) out += '<h3 class="note-h">' + esc(L[i]) + "</h3>";
        else out += '<p class="note-p">' + esc(L[i]) + "</p>";
      }
      return out;
    }
    var ORDER = [["w", "meetRef", "Meet Referee"], ["w", "admin", "Admin Official"], ["s", "deckRef", "Deck Referee"], ["s", "leadStarter", "Lead Starter"],
                 ["s", "reliefDeckRef", "Relief Deck Referee"], ["s", "reliefStarter", "Relief Starter"], ["s", "strokeTurn", "Stroke & Turn"]];
    function asgTable(whole, o) {   // one neat row per position, in a fixed order
      var rows = ORDER.map(function (r) {
        var names = (r[0] === "w" ? whole : o)[r[1]] || [];
        return names.length ? '<div class="asg-row"><div class="asg-pos' + (r[1] === "shadow" ? " shadow" : "") + '">' + esc(r[2]) + '</div><div class="asg-names">' + names.map(function (n) { return "<div>" + esc(n) + "</div>"; }).join("") + "</div></div>" : "";
      }).join("");
      var sh = (o.shadow || []).map(function (e) { var i = e.indexOf(" | "); return i > 0 ? { pos: e.slice(0, i), name: e.slice(i + 3) } : { pos: "Position not listed", name: e }; });
      var order = ["Meet Referee", "Admin Official", "Deck Referee", "Starter", "Stroke & Turn", "Chief Judge", "Position not listed"];
      var byPos = {}; sh.forEach(function (x) { (byPos[x.pos] = byPos[x.pos] || []).push(x.name); });
      var poss = Object.keys(byPos).sort(function (a, b) { return (order.indexOf(a) < 0 ? 99 : order.indexOf(a)) - (order.indexOf(b) < 0 ? 99 : order.indexOf(b)); });
      var shHtml = poss.length ? '<div class="asg-shadow"><h4>Shadowing</h4><div class="asg-table">' + poss.map(function (p) {
        return '<div class="asg-row"><div class="asg-pos">' + esc(p) + '</div><div class="asg-names">' + byPos[p].map(function (n) { return "<div>" + esc(n) + "</div>"; }).join("") + "</div></div>";
      }).join("") + "</div></div>" : "";
      return '<div class="asg-table">' + rows + "</div>" + shHtml;
    }
    function listHtml(label, names) {
      if (!names || !names.length) return "";
      return '<div class="asg-show"><h3>' + esc(label) + "</h3><ul>" + names.map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("") + "</ul></div>";
    }

    function render(m, claims) {
      var n = R.normMeet(m), asg = R.normAssign(m, n.sessions.length);
      R.WHOLE_GROUPS.forEach(function (g) { if (!asg.whole[g.key].length && claims[g.key]) asg.whole[g.key] = [claims[g.key]]; });
      var url = R.meetUrl(meetId), signupUrl = "signup.html?m=" + encodeURIComponent(meetId);
      var html = '<div class="card"><span class="pill green">Riptide hosted meet</span>' +
        '<h1 style="margin-top:8px">' + esc(m.title) + "</h1>" +
        '<div class="meet-when"><span class="when">' + esc(R.fmtRange(m)) + "</span>" + (m.location ? '<span class="where">' + esc(m.location) + "</span>" : "") + "</div>" +
        (n.v2 ? "" : notesHtml(m.notes)) +
        '<div class="btn-row"><a class="btn green" href="' + signupUrl + '">Sign up to work</a>' +
        '<button class="btn ghost" type="button" id="cal-btn">Add to calendar</button></div>' +
        '<div id="cal-opts" class="btn-row hidden">' +
        '<a class="btn small" target="_blank" rel="noopener" href="' + esc(R.googleCalUrl(m, url)) + '">Google Calendar</a>' +
        '<a class="btn small" download="' + esc(m.title.replace(/[^\w]+/g, "-")) + '.ics" href="' + R.icsHref(m, meetId, url) + '">Apple / Outlook (.ics)</a></div>' +
        (ctx.isMeetAdmin ? '<div class="coord-bar"><span class="coord-label">Coordinator only</span><div class="btn-row">' +
          '<a class="btn coord" href="signups.html?m=' + encodeURIComponent(meetId) + '">Sign-ups</a>' +
          '<a class="btn coord" href="assignments.html?m=' + encodeURIComponent(meetId) + '">Assigned positions</a>' +
          '<a class="btn coord" href="meet-edit.html?m=' + encodeURIComponent(meetId) + '">Edit meet details</a>' +
          '<button class="btn coord" type="button" id="copylink">Copy link</button></div></div>' : "") + "</div>";

      function nonEmpty(o, groups) { return groups.some(function (g) { return o[g.key] && o[g.key].length; }); }
      function sessionBody(x, i) {
        var o = asg.sessions[i], out = "";
        var det = R.parseSchedule(x.details).filter(function (d) { return d.value; });
        if (det.length) out += "<h3>Meet details</h3>" + '<table class="sched">' + det.map(function (d) {
          return "<tr><td>" + esc(d.label) + "</td><td>" + esc(d.value) + "</td></tr>"; }).join("") + "</table>";
        if (x.notes) out += "<h3>Notes for officials</h3>" + paras(x.notes);
        var ud = R.uniformDays(n.info).filter(function (d) { return !d.date || !x.date || d.date === x.date || n.sessions.length === 1; });
        if (ud.length) out += "<h3>Meet uniform</h3>" + ud.map(function (d) {
          return (d.date && (ud.length > 1) ? '<p class="uni-day-line"><strong>' + esc(R.fmtDate(d.date)) + "</strong></p>" : "") + paras(d.text);
        }).join("");
        out += "<h3>Meet assignments</h3>";
        var anyHere = nonEmpty(asg.whole, R.WHOLE_GROUPS) || nonEmpty(o, R.SESSION_GROUPS);
        out += anyHere ? asgTable(asg.whole, o)
          : '<p class="muted">Assignments will be posted here once the coordinator has filled them in.</p>';
        return out;
      }

      if (n.v2) {
        var single = n.sessions.length === 1;
        n.sessions.forEach(function (x, i) {
          var when = R.sessionWhen(x);
          var title = single ? (when || "Meet details") : x.name;
          html += '<div class="card session"><h2>' + esc(title) + "</h2>" +
            (!single && when ? '<p class="when-line">' + esc(when) + "</p>" : "") + sessionBody(x, i) + "</div>";
        });
        if (n.info.parking) html += '<div class="card"><h2>Parking</h2>' + paras(n.info.parking) + "</div>";
        if (n.info.food) html += '<div class="card"><h2>Food</h2>' + paras(n.info.food) + "</div>";
        if (n.info.misc) html += '<div class="card"><h2>Miscellaneous</h2>' + paras(n.info.misc) + "</div>";
      } else {
        if (m.schedule) html += '<div class="card"><h2>Meet details</h2><table class="sched">' + R.parseSchedule(m.schedule).map(function (s) {
          return "<tr><td>" + esc(s.label) + "</td><td>" + esc(s.value) + "</td></tr>"; }).join("") + "</table></div>";
        var anyAsg = nonEmpty(asg.whole, R.WHOLE_GROUPS) || asg.sessions.some(function (o) { return nonEmpty(o, R.SESSION_GROUPS); });
        html += '<div class="card" id="assignments"><h2>Meet assignments</h2>' + (anyAsg
          ? asgTable(asg.whole, asg.sessions[0])
          : '<p class="muted">Assignments will be posted here once the coordinator has filled them in.</p>') + "</div>";
      }
      app.innerHTML = html;

      document.getElementById("cal-btn").onclick = function () { document.getElementById("cal-opts").classList.toggle("hidden"); };
      var cl = document.getElementById("copylink");
      if (cl) cl.onclick = function () { R.copyText(url).then(function () { cl.textContent = "Copied!"; setTimeout(function () { cl.textContent = "Copy link"; }, 1500); }); };
    }
  });
})();
</script>
</body>
</html>
