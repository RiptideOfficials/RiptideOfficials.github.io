<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin | Riptide Officials</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#0a2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Officials">
<link rel="icon" href="assets/img/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main id="app"><div class="card loading">Loading...</div></main>
<div class="footer" id="site-footer"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  var R = window.Riptide, esc = R.esc, $ = function (id) { return document.getElementById(id); };
  R.footer();
  var DEFAULT_SCHEDULE = "Warm-ups | \nOfficials meeting | \nTimers meeting | \nMeet starts | ";
  var DEFAULT_ROLES = "Meet Referee | 1\nAdmin Official | 1\nStarter\nStroke & Turn\nChief Judge\nDeck Referee";

  var SITE = location.href.split("#")[0].split("?")[0].replace(/[^\/]*$/, "");
  R.requireAdmin("admin").then(function (ctx) {
    if (!ctx) return;
    $("app").innerHTML =
      "<h1>Admin</h1>" +
      '<div class="card"><h2>Share this site</h2><p class="muted small" style="margin-top:0">Send this link to anyone. They land on the Riptide Officials home page, where they can log in or ask to become an official.</p>' +
      '<p><a href="' + R.esc(SITE) + '" target="_blank" rel="noopener"><strong>' + R.esc(SITE) + '</strong></a></p>' +
      '<div class="btn-row" style="margin-top:0"><button class="btn" type="button" id="share-site">Share</button><button class="btn ghost" type="button" id="copy-site">Copy link</button></div></div>' +
      '<div class="card" id="backup-card"><h2>Backup and restore</h2>' +
      '<p class="muted small" style="margin-top:0">Your site is stored online, not on your phone, so a new phone only means logging in again. This makes a backup file you can keep anyway: all meets, sign-ups, assignments, edited pages, interested people and member list.</p>' +
      '<div class="btn-row" style="margin-top:0"><button class="btn" type="button" id="bk-export">Download a backup</button></div>' +
      '<p class="muted small">The file contains names, emails and phone numbers. Keep it private.</p>' +
      '<h3>Restore from a backup</h3><p class="muted small" style="margin-top:0">Puts meets, sign-ups, assignments, edited pages and interested people back from a backup file. Anything with the same ID is replaced by the backup version. Member accounts are not restored, since people sign in with their own passwords.</p>' +
      '<input type="file" id="bk-file" accept=".json,application/json"> <div class="btn-row"><button class="btn ghost" type="button" id="bk-import" disabled>Restore this backup</button></div>' +
      '<div id="bk-msg" role="status"></div></div>' +
      '<div class="card" id="badge-card" hidden><h2>Phone alerts</h2>' +
      '<p class="muted small" style="margin-top:0">Get an alert on this phone when someone creates an account or signs up as interested, and keep the red number on the Riptide icon up to date. Needs the site added to your home screen. Tap the button once and allow notifications.</p>' +
      '<div class="btn-row" style="margin-top:0"><button class="btn" type="button" id="badge-on">Turn on phone alerts</button></div><div id="badge-msg" role="status"></div></div>' +
      '<div class="card" id="meets-card"><h2>Meets</h2><div class="btn-row" style="margin:0 0 10px"><a class="btn coord" href="meet-edit.html">+ Add a meet</a></div><ul class="meet-list" id="meets"><li class="muted">Loading...</li></ul></div>' +
      '<div class="card"><h2>Private team info</h2><p class="muted small">Only approved members can see this, and it is never stored in the website files.</p>' +
      '<label for="t-link">USA Swimming team registration link</label><input id="t-link" placeholder="https://omr.usaswimming.org/omr/welcome/...">' +
      '<div class="btn-row"><button class="btn green" id="t-save" type="button">Save</button></div><div id="t-status" role="status"></div></div>' +
      '<div class="card"><h2>People interested in becoming officials <span class="cnt" id="b-int" hidden></span></h2><p class="muted small">From the "I\'m interested" form on the public pages.</p><div id="interested">Loading...</div></div>' +
      '<div class="card"><h2>Members <span class="cnt" id="b-mem" hidden></span></h2><p class="muted small">New accounts wait here until approved. Admins can see members\' email and phone. ' + (ctx.isOwner ? 'To let another Meet Ref (or anyone) help run meets, approve their account and tap <strong>Make admin</strong>. Admins can add and edit meets, email officials, and approve members. To give someone access to <strong>meets only</strong> (add and edit meets, see sign-ups, set assignments), tap <strong>Make meet manager</strong> instead.' : '') + '</p><div id="members" class="table-wrap">Loading...</div></div>';
    Array.prototype.forEach.call(document.querySelectorAll("#app .card"), function (c) { c.classList.add("coord-card"); });
    // make every box collapsible (triangle), with Expand all / Collapse all at the top
    Array.prototype.forEach.call(document.querySelectorAll("#app .card"), function (c) {
      var h = c.querySelector("h2"); if (!h) return;
      var d = document.createElement("details"), s = document.createElement("summary"), body = document.createElement("div");
      d.className = "fold"; body.className = "fold-body";
      s.appendChild(h);
      while (c.firstChild) body.appendChild(c.firstChild);
      d.appendChild(s); d.appendChild(body); c.appendChild(d);
      if (c.id === "meets-card" || c.id === "badge-card") d.open = true;
      // remember each box's open/closed state on this device
      var fkey = "ro_fold_" + (c.id || String((h.childNodes[0] && h.childNodes[0].textContent) || "box").trim().toLowerCase().replace(/[^a-z]+/g, "-"));
      try { var sv = localStorage.getItem(fkey); if (sv === "1") d.open = true; else if (sv === "0") d.open = false; } catch (e) {}
      d.addEventListener("toggle", function () { try { localStorage.setItem(fkey, d.open ? "1" : "0"); } catch (e) {} });
    });
    var bar = document.createElement("div"); bar.className = "btn-row"; bar.style.margin = "0 0 14px";
    bar.innerHTML = '<button class="btn small coord all-tog" type="button" id="tog-all"><span class="tri" aria-hidden="true"></span> All</button>';
    $("app").insertBefore(bar, $("app").querySelector(".card"));
    function folds() { return Array.prototype.slice.call(document.querySelectorAll("#app details.fold")); }
    function anyOpen() { return folds().some(function (d) { return d.open; }); }
    function sync() { var o = anyOpen(), b = $("tog-all"); b.classList.toggle("is-open", o); b.title = o ? "Collapse all" : "Expand all"; b.setAttribute("aria-label", b.title + " boxes"); }
    $("tog-all").onclick = function () { var v = !anyOpen(); folds().forEach(function (d) { d.open = v; }); sync(); };
    document.addEventListener("toggle", sync, true);
    sync();

    var meets = [];

    function loadMeets() {
      return R.db.collection("meets").orderBy("date", "desc").get().then(function (snap) {
        meets = snap.docs.map(function (d) { var m = d.data(); m.id = d.id; return m; });
        $("meets").innerHTML = meets.length ? meets.map(function (m) {
          return "<li><div><strong>" + esc(m.title) + "</strong><br><span class=\"muted small\">" + esc(R.fmtRange(m)) + "</span></div>" +
            '<div class="btn-row" style="margin:0"><a class="btn small" href="meet.html?m=' + encodeURIComponent(m.id) + '">Open</a>' +
            '<a class="btn small coord" href="assignments.html?m=' + encodeURIComponent(m.id) + '">Assignments</a>' +
            '<button class="btn small ghost" data-copy="' + esc(m.id) + '">Copy link</button>' +
            '<a class="btn small ghost" href="meet-edit.html?m=' + encodeURIComponent(m.id) + '">Edit</a>' +
            '<button class="btn small danger" data-del="' + esc(m.id) + '">Delete</button></div></li>';
        }).join("") : '<li class="muted">No meets yet.</li>';
      });
    }

    $("copy-site").onclick = function () { var b = this; R.copyText(SITE).then(function () { b.textContent = "Copied!"; setTimeout(function () { b.textContent = "Copy link"; }, 1500); }); };
    $("share-site").onclick = function () {
      if (navigator.share) navigator.share({ title: "Riptide Officials", text: "Riptide Swimming Officials", url: SITE }).catch(function () {});
      else R.copyText(SITE).then(function () { $("share-site").textContent = "Link copied!"; });
    };


    // ----- phone alerts + home screen icon number (Web Push; iPhone needs the home-screen app) -----
    (function () {
      var card = $("badge-card"); if (!card) return;
      var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
      var can = ("serviceWorker" in navigator) && ("PushManager" in window) && ("Notification" in window);
      var msg = function (c, t) { $("badge-msg").innerHTML = '<div class="msg ' + c + '">' + t + '</div>'; };
      function b64(k) { var p = "=".repeat((4 - k.length % 4) % 4), r = atob((k + p).replace(/-/g, "+").replace(/_/g, "/")), o = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) o[i] = r.charCodeAt(i); return o; }
      function save(sub) { return R.db.collection("adminpush").doc(R.auth.currentUser.uid).set({ sub: JSON.stringify(sub), ua: navigator.userAgent.slice(0, 120), at: firebase.firestore.FieldValue.serverTimestamp() }); }
      function enable() {
        return Notification.requestPermission().then(function (p) {
          if (p !== "granted") throw new Error("Notifications were not allowed. You can allow them in your phone settings under Riptide Officials.");
          return navigator.serviceWorker.register("sw.js").then(function () { return navigator.serviceWorker.ready; });
        }).then(function (reg) {
          return reg.pushManager.getSubscription().then(function (s) { return s || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(window.VAPID_PUBLIC_KEY) }); });
        }).then(function (s) { return save(s.toJSON()); });
      }
      if (!can) { card.hidden = false; $("badge-on").hidden = true; msg("info", standalone ? "This phone or browser does not support alerts." : "Open the site from the icon on your home screen first (iPhone needs iOS 16.4 or newer), then come back to this box."); return; }
      card.hidden = false;
      if (!standalone && /iphone|ipad/i.test(navigator.userAgent)) msg("info", "Open the site from the icon on your home screen first, then come back to this box.");
      if (Notification.permission === "granted") { enable().then(function () { $("badge-on").textContent = "Phone alerts are on"; msg("ok", "On. You will get an alert about every 15 minutes at most after someone signs up, and the icon number updates."); }).catch(function () {}); }
      $("badge-on").onclick = function () {
        enable().then(function () { R.adminBadge(); $("badge-on").textContent = "Phone alerts are on"; msg("ok", "On. This phone will now get an alert (and the icon number will update) within about 15 minutes of someone signing up."); })
          .catch(function (e) { msg("err", (e && e.message) || "Could not turn on alerts."); });
      };
    })();
    // ----- backup / restore -----
    function bkSer(v) {
      if (v && typeof v.toMillis === "function") return { __ts: v.toMillis() };
      if (Array.isArray(v)) return v.map(bkSer);
      if (v && typeof v === "object") { var o = {}; Object.keys(v).forEach(function (k) { o[k] = bkSer(v[k]); }); return o; }
      return v;
    }
    function bkDes(v) {
      if (v && typeof v === "object" && !Array.isArray(v)) {
        if (Object.keys(v).length === 1 && typeof v.__ts === "number") return firebase.firestore.Timestamp.fromMillis(v.__ts);
        var o = {}; Object.keys(v).forEach(function (k) { o[k] = bkDes(v[k]); }); return o;
      }
      if (Array.isArray(v)) return v.map(bkDes);
      return v;
    }
    function bkDocs(q) { return q.get().then(function (s) { return s.docs.map(function (d) { return { id: d.id, data: bkSer(d.data()) }; }); }); }
    $("bk-export").onclick = function () {
      var b = this, msg = $("bk-msg"); b.disabled = true; msg.innerHTML = '<div class="msg info">Collecting everything...</div>';
      var out = { app: "riptide-officials", version: 1, exportedAt: new Date().toISOString(), meets: [], interest: [], pagecontent: [], private: [], users: [] };
      R.db.collection("meets").get().then(function (snap) {
        return Promise.all(snap.docs.map(function (d) {
          var ref = R.db.collection("meets").doc(d.id);
          return Promise.all([bkDocs(ref.collection("contacts")), bkDocs(ref.collection("whole"))]).then(function (r) {
            out.meets.push({ id: d.id, data: bkSer(d.data()), contacts: r[0], whole: r[1] });
          });
        }));
      }).then(function () { return Promise.all([bkDocs(R.db.collection("interest")), bkDocs(R.db.collection("pagecontent")), bkDocs(R.db.collection("private")), bkDocs(R.db.collection("users"))]); })
        .then(function (r) {
          out.interest = r[0]; out.pagecontent = r[1]; out.private = r[2]; out.users = r[3];
          var blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
          var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
          a.download = "riptide-officials-backup-" + new Date().toISOString().slice(0, 10) + ".json";
          document.body.appendChild(a); a.click(); a.remove();
          var n = out.meets.length, su = out.meets.reduce(function (t, m) { return t + m.contacts.length; }, 0);
          msg.innerHTML = '<div class="msg ok">Backup downloaded: ' + n + " meet(s), " + su + " sign-up(s), " + out.interest.length + " interested, " + out.users.length + " member(s), " + out.pagecontent.length + " edited page(s). Check your Downloads folder.</div>";
        }).catch(function () { msg.innerHTML = '<div class="msg err">Could not make the backup. Check your connection and try again.</div>'; })
        .then(function () { b.disabled = false; });
    };
    var bkData = null;
    $("bk-file").onchange = function () {
      var f = this.files[0], msg = $("bk-msg"); bkData = null; $("bk-import").disabled = true;
      if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        try {
          var d = JSON.parse(rd.result);
          if (d.app !== "riptide-officials" || !Array.isArray(d.meets)) throw new Error("bad");
          bkData = d; $("bk-import").disabled = false;
          msg.innerHTML = '<div class="msg info">Backup from ' + esc(new Date(d.exportedAt).toLocaleString()) + ": " + d.meets.length + " meet(s), " + (d.interest || []).length + " interested, " + (d.pagecontent || []).length + " edited page(s). Tap Restore to put it back.</div>";
        } catch (e) { msg.innerHTML = '<div class="msg err">That does not look like a Riptide Officials backup file.</div>'; }
      };
      rd.readAsText(f);
    };
    $("bk-import").onclick = function () {
      if (!bkData || !confirm("Restore this backup? Anything with the same ID will be replaced by the backup version.")) return;
      var b = this, msg = $("bk-msg"), ok = 0, bad = 0, jobs = [];
      b.disabled = true; msg.innerHTML = '<div class="msg info">Restoring...</div>';
      function put(ref, data) { jobs.push(ref.set(bkDes(data)).then(function () { ok++; }).catch(function () { bad++; })); }
      bkData.meets.forEach(function (m) {
        var ref = R.db.collection("meets").doc(m.id); put(ref, m.data);
        (m.whole || []).forEach(function (x) { put(ref.collection("whole").doc(x.id), x.data); });
        (m.contacts || []).forEach(function (x) { put(ref.collection("contacts").doc(x.id), x.data); });
      });
      (bkData.interest || []).forEach(function (x) { put(R.db.collection("interest").doc(x.id), x.data); });
      (bkData.pagecontent || []).forEach(function (x) { put(R.db.collection("pagecontent").doc(x.id), x.data); });
      (bkData.private || []).forEach(function (x) { put(R.db.collection("private").doc(x.id), x.data); });
      Promise.all(jobs).then(function () {
        msg.innerHTML = '<div class="msg ' + (bad ? "info" : "ok") + '">Restored ' + ok + " item(s)." + (bad ? " " + bad + " could not be restored (usually sign-ups from people who had signed in, which the site's safety rules don't allow an admin to recreate)." : "") + " Refresh the page to see them.</div>";
        b.disabled = false;
      });
    };
    $("meets").addEventListener("click", function (e) {
      var t = e.target, g = function (a) { return t.getAttribute && t.getAttribute(a); };
      if (g("data-copy")) R.copyText(R.meetUrl(g("data-copy"))).then(function () { t.textContent = "Copied!"; setTimeout(function () { t.textContent = "Copy link"; }, 1500); });
      if (g("data-del")) {
        var id = g("data-del"), m = meets.filter(function (x) { return x.id === id; })[0];
        if (!confirm('Delete "' + (m ? m.title : "this meet") + '" and everyone signed up for it? This cannot be undone.')) return;
        var ref = R.db.collection("meets").doc(id);
        Promise.all([ref.collection("contacts").get()]).then(function (r) {
          var batch = R.db.batch();
          r[0].docs.forEach(function (d) { batch.delete(d.ref); });
          batch.delete(ref);
          return batch.commit();
        }).then(loadMeets).catch(function () { alert("Could not delete that meet."); });
      }
    });

    function loadMembers() {
      return R.db.collection("users").orderBy("createdAt", "desc").get().then(function (snap) {
        var users = snap.docs.map(function (d) { var u = d.data(); u.id = d.id; return u; });
        var isOwnerEmail = function (u) { return String(u.email).toLowerCase() === String(window.ADMIN_EMAIL).toLowerCase(); };
        var waiting = users.filter(function (u) { return !u.approved; }), ok = users.filter(function (u) { return u.approved; });
        var html = "";
        if (waiting.length) html += '<div class="mem-wait-box"><h3>Waiting for approval (' + waiting.length + ")</h3>" + waiting.map(function (u) {
          return '<div class="mem-wait"><div><strong>' + esc(u.name) + '</strong><br><a href="mailto:' + esc(u.email) + '">' + esc(u.email) + "</a>" + (u.phone ? " &middot; " + esc(u.phone) : "") + '</div>' +
            '<div class="btn-row" style="margin:6px 0 0"><button class="btn small green" data-approve="' + esc(u.id) + '">Approve</button> <button class="btn small danger" data-deluser="' + esc(u.id) + '">Delete</button></div></div>';
        }).join("") + "</div>";
        else html += '<p class="muted" style="margin-top:0">No one is waiting for approval.</p>';
        var showDet = false; try { showDet = localStorage.getItem("ro_mem_details") === "1"; } catch (e) {}
        html += '<details class="mem-ok"' + (waiting.length ? "" : " open") + '><summary>Approved members (' + ok.length + ")</summary>" +
          '<div class="mem-bar"><button type="button" class="lnk" id="mem-det-toggle">' + (showDet ? "Hide full details" : "Show full details") + "</button></div>" +
          '<div class="mem-list' + (showDet ? " show-det" : "") + '" id="mem-list">' + ok.map(function (u) {
          var admin = u.admin || isOwnerEmail(u);
          return '<div class="mem-row"><div class="mem-who"><strong>' + esc(u.name) + "</strong>" + (admin ? ' <span class="pill green">Admin</span>' : (u.meetAdmin ? ' <span class="pill green">Meet manager</span>' : "")) +
            '<span class="mem-det muted small"><br>' + esc(u.email) + (u.phone ? " &middot; " + esc(u.phone) : "") + "</span></div>" +
            '<div class="mem-btns">' + (ctx.isOwner && !isOwnerEmail(u) ? (u.admin ? '<button class="btn xs ghost" data-unadmin="' + esc(u.id) + '">Remove admin</button>' : '<button class="btn xs green" data-mkadmin="' + esc(u.id) + '">Make admin</button>') + (u.admin ? "" : (u.meetAdmin ? '<button class="btn xs ghost" data-unmm="' + esc(u.id) + '">Remove meet manager</button>' : '<button class="btn xs ghost" data-mkmm="' + esc(u.id) + '">Make meet manager</button>')) : "") +
            (isOwnerEmail(u) ? "" : '<button class="btn xs ghost" data-unapprove="' + esc(u.id) + '">Remove access</button>') + "</div></div>";
        }).join("") + "</div></details>";
        $("members").innerHTML = users.length ? html : '<p class="muted">No accounts yet.</p>';
        var dt = $("mem-det-toggle");
        if (dt) dt.onclick = function () { var l = $("mem-list"), on = l.classList.toggle("show-det"); dt.textContent = on ? "Hide full details" : "Show full details"; try { localStorage.setItem("ro_mem_details", on ? "1" : "0"); } catch (e) {} };
        setBadge("b-mem", users.filter(function (u) { return !u.approved; }).length); R.adminBadge();
      }).catch(function () { $("members").innerHTML = '<div class="msg err">Could not load members.</div>'; });
    }
    $("members").addEventListener("click", function (e) {
      var t = e.target, g = function (a) { return t.getAttribute && t.getAttribute(a); };
      var users = R.db.collection("users"), p;
      if (g("data-approve")) p = users.doc(g("data-approve")).update({ approved: true });
      else if (g("data-mkadmin")) { if (!confirm("Make this person an admin? They will be able to see everyone's contact info, email officials, and edit meets.")) return; p = users.doc(g("data-mkadmin")).update({ admin: true }); }
      else if (g("data-unadmin")) p = users.doc(g("data-unadmin")).update({ admin: false });
      else if (g("data-mkmm")) { if (!confirm("Make this person a meet manager? They can add and edit meets, see sign-up contact details, and set up assignments. They cannot approve members or edit anything else on the site.")) return; p = users.doc(g("data-mkmm")).update({ meetAdmin: true }); }
      else if (g("data-unmm")) p = users.doc(g("data-unmm")).update({ meetAdmin: false });
      else if (g("data-unapprove")) { if (!confirm("Remove this person's access?")) return; p = users.doc(g("data-unapprove")).update({ approved: false, admin: false, meetAdmin: false }); }
      else if (g("data-deluser")) { if (!confirm("Delete this account request?")) return; p = users.doc(g("data-deluser")).delete(); }
      if (p) p.then(loadMembers).catch(function () { alert("That didn't work. Please try again."); });
    });

    R.db.collection("private").doc("team").get().then(function (snap) {
      if (snap.exists) $("t-link").value = snap.data().registrationLink || "";
    }).catch(function () {});
    $("t-save").onclick = function () {
      var v = $("t-link").value.trim(), st = $("t-status");
      if (v && !/^https:\/\/omr\.usaswimming\.org\//.test(v)) { st.innerHTML = '<div class="msg err">That should start with https://omr.usaswimming.org/</div>'; return; }
      R.db.collection("private").doc("team").set({ registrationLink: v })
        .then(function () { st.innerHTML = '<div class="msg ok">Saved.</div>'; })
        .catch(function () { st.innerHTML = '<div class="msg err">Could not save.</div>'; });
    };

    function loadInterested() {
      return R.db.collection("interest").orderBy("createdAt", "desc").get().then(function (snap) {
        var rows = snap.docs.map(function (d) { var u = d.data(); u.id = d.id; return u; });
        $("interested").innerHTML = rows.length ? '<ul class="meet-list">' + rows.map(function (u) {
          return "<li><div><strong>" + esc(u.name) + '</strong> <span class="muted small">' + esc(new Date(u.createdAt).toLocaleDateString()) + "</span><br>" +
            '<a href="mailto:' + esc(u.email) + '">' + esc(u.email) + "</a>" + (u.phone ? " &middot; " + esc(u.phone) : "") +
            (u.swimmer ? '<br><span class="small">Swimmer: ' + esc(u.swimmer) + "</span>" : "") +
            (u.message ? '<br><span class="small">' + esc(u.message) + "</span>" : "") +
            '</div><div class="btn-row" style="margin:0;flex:none">' + (u.responded ? '<span class="pill green">Responded</span> <button class="btn small ghost" data-unresp="' + esc(u.id) + '">Undo</button>' : '<button class="btn small green" data-resp="' + esc(u.id) + '">I responded</button>') +
            ' <button class="btn small danger" data-delint="' + esc(u.id) + '">Delete</button></div></li>';
        }).join("") + "</ul>" : '<p class="muted">No one yet.</p>';
        setBadge("b-int", rows.filter(function (u) { return !u.responded; }).length); R.adminBadge();
      }).catch(function () { $("interested").innerHTML = '<div class="msg err">Could not load. Make sure the latest firestore.rules are published.</div>'; });
    }
    function setBadge(id, n) { var b = $(id); if (!b) return; b.textContent = n; b.hidden = !n; }
    $("interested").addEventListener("click", function (e) {
      var g = function (a) { return e.target.getAttribute && e.target.getAttribute(a); };
      var col = R.db.collection("interest");
      if (g("data-resp")) return col.doc(g("data-resp")).update({ responded: true }).then(loadInterested).catch(function () { alert("Could not save."); });
      if (g("data-unresp")) return col.doc(g("data-unresp")).update({ responded: false }).then(loadInterested).catch(function () { alert("Could not save."); });
      var id = g("data-delint");
      if (!id || !confirm("Delete this entry?")) return;
      R.db.collection("interest").doc(id).delete().then(loadInterested).catch(function () { alert("Could not delete."); });
    });

    loadMeets(); loadMembers(); loadInterested();
  });
})();
</script>
</body>
</html>
