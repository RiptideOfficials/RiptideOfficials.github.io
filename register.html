<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Register with USA Swimming | Riptide Officials</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#0a2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Officials">
<link rel="icon" href="assets/img/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main id="app"><div class="card loading">Loading...</div></main>
<div class="footer" id="site-footer"></div>

<template id="content">
<div class="guide-head" id="head" data-edit-head>
  <h1>Register with USA Swimming (2026)</h1>
  <p class="muted">Pick the path that fits you, then check off each step as you go.</p>
  <div class="btn-row">
    <a class="btn small ghost" href="docs/training/Riptide_Officials_Registration_Steps.docx" download>Download as Word</a>
    <button class="btn small ghost" type="button" data-print>Print</button>
    <button class="btn small ghost" type="button" data-reset>Start over</button>
  </div>
</div>
<div id="progress"></div>
<div class="callout"><strong>New officials: please register as an APPRENTICE OFFICIAL.</strong> The apprentice membership gives you access to the officials' education resources for a 60-day grace period, without a paid membership fee.</div>
<div class="card"><h3>Jump to</h3>
  <div class="btn-row" style="margin-top:0">
    <a class="btn small" href="#step-1">First time officials</a>
    <a class="btn small" href="#renew">Renew my membership</a>
    <a class="btn small" href="#upgrade">Upgrade Apprentice to Registered</a>
  </div>
  <p style="margin:14px 0 4px"><strong>Use this link to get started (new 2026 link):</strong></p>
  <div data-team-link style="margin:10px 0">Loading the team link...</div>
</div>
<section class="step card" id="step-1" data-editable>
  <input type="checkbox" class="stepbox" data-step="r1" aria-label="Mark step 1 done">
  <div class="body"><div class="num">Step 1</div><h2>First time officials: start registering</h2>

    <p>If this is your first time registering, click <strong>&ldquo;Register New Member&rdquo;</strong>.</p>
    <img class="shot" src="assets/img/guide/register-new-member.png" alt="Register New Member box" loading="lazy">

  </div>
</section>
<section class="step card" id="step-2" data-editable>
  <input type="checkbox" class="stepbox" data-step="r2" aria-label="Mark step 2 done">
  <div class="body"><div class="num">Step 2</div><h2>Register the membership for yourself</h2>

    <p>The membership is <strong>for yourself</strong> (choose &ldquo;I am registering myself&rdquo;). Click through the screens and enter your information.</p>

  </div>
</section>
<section class="step card" id="step-3" data-editable>
  <input type="checkbox" class="stepbox" data-step="r3" aria-label="Mark step 3 done">
  <div class="body"><div class="num">Step 3</div><h2>Choose Apprentice Official</h2>

    <p>Choose the <strong>Officials</strong> check box or <strong>Apprentice Official</strong> for the current year.</p>
    <img class="shot" src="assets/img/guide/membership-select.png" alt="Membership screen with Apprentice Official checked" loading="lazy">

  </div>
</section>
<section class="step card" id="step-4" data-editable>
  <input type="checkbox" class="stepbox" data-step="r4" aria-label="Mark step 4 done">
  <div class="body"><div class="num">Step 4</div><h2>Check out and pay later</h2>

    <p>Proceed with the checkout and choose the option <strong>&ldquo;Pay for this Later&rdquo;</strong>.</p>
    <img class="shot" src="assets/img/guide/pay-later.png" alt="Checkout screen showing Pay for this later" loading="lazy">

  </div>
</section>
<h2 class="group-title" id="renew" style="margin-top:26px;scroll-margin-top:90px">Existing officials: renew</h2>
<section class="step card" id="step-5" data-editable>
  <input type="checkbox" class="stepbox" data-step="r5" aria-label="Mark step 5 done">
  <div class="body"><div class="num">Step 5</div><h2>Check Official next to your name</h2>

    <p>Log in and scroll to the bottom. Check the box for <strong>Official</strong> next to your name.</p>

  </div>
</section>
<section class="step card" id="step-6" data-editable>
  <input type="checkbox" class="stepbox" data-step="r6" aria-label="Mark step 6 done">
  <div class="body"><div class="num">Step 6</div><h2>Click Renew</h2>

    <img class="shot sm" src="assets/img/guide/renew-button.png" alt="Renew button" loading="lazy">

  </div>
</section>
<section class="step card" id="step-7" data-editable>
  <input type="checkbox" class="stepbox" data-step="r7" aria-label="Mark step 7 done">
  <div class="body"><div class="num">Step 7</div><h2>Confirm you're in Good Standing</h2>

    <p>Log back in and make sure your dashboard shows <strong>Official</strong> and <strong>Parent</strong>, and that your Officials status is <strong>&ldquo;Good Standing&rdquo;</strong>.</p>

  </div>
</section>
<h2 class="group-title" id="upgrade" style="margin-top:26px;scroll-margin-top:90px">Upgrade from Apprentice to Registered</h2>
<section class="step card" id="step-8" data-editable>
  <input type="checkbox" class="stepbox" data-step="r8" aria-label="Mark step 8 done">
  <div class="body"><div class="num">Step 8</div><h2>Upgrade your membership</h2>

    <p>Follow the instructions in <a href="https://websitedevsa.blob.core.windows.net/sitefinity/docs/default-source/swims-documents/members/how-do-i-upgrade-a-membership.pdf?sfvrsn=398d0632_1" target="_blank" rel="noopener">How do I upgrade a membership?</a> (PDF from USA Swimming).</p>

  </div>
</section>

</template>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/app.js"></script>
<script src="assets/edit.js"></script>
<script src="assets/guide.js"></script>
<script>Guide.init({ key: "register", persist: true, active: "docs" });</script>
</body>
</html>
