<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Assigned positions | Riptide Officials</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#0a2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Officials">
<link rel="icon" href="assets/img/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main id="app"><div class="card loading">Loading...</div></main>
<div class="footer" id="site-footer"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/app.js"></script>
<script>
/* Admin-only: see everyone who signed up and assign positions, session by session. */
(function () {
  var R = window.Riptide, esc = R.esc, app = document.getElementById("app");
  R.footer();
  var meetId = new URLSearchParams(location.search).get("m");
  R.requireAdmin("meets").then(function (ctx) {
    if (!ctx) return;
    if (!meetId) { app.innerHTML = '<div class="card"><h2>Meet not found</h2></div>'; return; }
    var meetRef = R.db.collection("meets").doc(meetId);
    var $ = function (id) { return document.getElementById(id); };
    meetRef.get().then(function (snap) {
      if (!snap.exists) { app.innerHTML = '<div class="card"><h2>Meet not found</h2></div>'; return; }
      document.title = "Assigned positions: " + snap.data().title;
      render(snap.data());
    }).catch(function () { app.innerHTML = '<div class="msg err">Could not load this meet.</div>'; });

    function render(m) {
      var n = R.normMeet(m), asg = R.normAssign(m, n.sessions.length), signups = [], claims = {};
      var detailsUrl = "meet.html?m=" + encodeURIComponent(meetId), signupUrl = "signup.html?m=" + encodeURIComponent(meetId);
      app.innerHTML =
        '<p style="margin:0 0 10px"><a href="' + detailsUrl + '">&larr; Meet details (what officials see)</a></p>' +
        '<div class="card"><span class="pill">Coordinator only</span><h1 style="margin-top:8px">' + esc(m.title) + ": assigned positions</h1>" +
        "<p><strong>" + esc(R.fmtRange(m)) + "</strong>" + (m.location ? "<br>" + esc(m.location) : "") + "</p>" +
        '<div class="btn-row"><a class="btn small ghost" href="' + signupUrl + '">Sign-up page</a>' +
        '<button class="btn small ghost" id="copysu" type="button">Copy sign-up link</button></div></div>' +
        '<div class="card" id="people-card"><h2>Signed up</h2><div id="people" class="muted">Loading...</div></div>' +
        '<div id="assign-area"></div>' +
        '<div class="card hidden" id="tools-card"></div>' +
        '<div class="btn-row"><button class="btn green" type="button" id="asg-save">Save and publish</button></div><div id="asg-status" role="status"></div>';
      Array.prototype.forEach.call(app.querySelectorAll(".card"), function (c) { c.classList.add("coord-card"); });
      $("copysu").onclick = function () {
        var u = R.meetUrl(meetId).replace("meet.html", "signup.html");
        R.copyText(u).then(function () { $("copysu").textContent = "Copied!"; setTimeout(function () { $("copysu").textContent = "Copy sign-up link"; }, 1500); });
      };

      function label(s) { return s.name + (s.team && !/^riptide$/i.test(s.team) ? " (" + s.team + ")" : ""); }   // what gets published
      function labelLv(s) { return label(s) + (s.level ? " [" + s.level + "]" : ""); }
      function arr(x) { return Array.isArray(x) ? x : (x ? [x] : []); }
      function picks(s, i, kind) {
        if (Array.isArray(s.perSession)) { var f = s.perSession.filter(function (x) { return x.i === i; })[0]; return f ? arr(f[kind]) : []; }
        return i === 0 ? arr(kind === "work" ? s.certified : s.shadow) : [];
      }
      function wholeCerts(s) { return arr(s.certified).filter(function (x) { return R.WHOLE_POS.indexOf(x) >= 0; }); }

      function drawPeople() {
        var el = $("people");
        if (!signups.length) { el.textContent = "No sign-ups yet."; return; }
        el.className = "";
        el.innerHTML = '<div class="table-wrap"><table class="data"><thead><tr><th>Name</th><th>Level</th><th>Signed up for</th><th>Comments</th><th>Email / phone</th><th></th></tr></thead><tbody>' +
          signups.map(function (s) {
            var lines = [];
            var w = wholeCerts(s); var ws = arr(s.shadow).filter(function (x) { return R.WHOLE_POS.indexOf(x) >= 0; });
            if (w.length || ws.length) lines.push("<strong>All sessions:</strong> " + esc(w.join(", ")) + (ws.length ? (w.length ? "; " : "") + "<em>shadow " + esc(ws.join(", ")) + "</em>" : ""));
            n.sessions.forEach(function (x, i) {
              var wk = picks(s, i, "work").filter(function (p) { return R.WHOLE_POS.indexOf(p) < 0 || !n.v2; }), sh = picks(s, i, "shadow");
              if (wk.length || sh.length) lines.push("<strong>" + esc(x.name) + ":</strong> " + esc(wk.join(", ")) + (sh.length ? (wk.length ? "; " : "") + "<em>shadow " + esc(sh.join(", ")) + "</em>" : ""));
            });
            return "<tr><td>" + esc(s.name + (s.team && !/^riptide$/i.test(s.team) ? " (" + s.team + ")" : "")) + "</td><td>" + esc(s.level || "") + "</td><td>" + (lines.join("<br>") || "") + "</td><td>" + esc(s.comments || "") +
              "</td><td>" + esc(s.email || "") + "<br>" + esc(s.phone || "") +
              '</td><td><button class="btn small danger" data-remove="' + esc(s.id) + '">Remove</button></td></tr>';
          }).join("") + "</tbody></table></div>";
      }

      function groupHtml(scope, g, list, sessionIndex) {
        var id = scope + ":" + g.key, cands = [], names = {};
        signups.forEach(function (s) {
          var ok, info;
          if (scope === "w") { ok = arr(s.certified).some(function (x) { return x.toLowerCase() === g.cert.toLowerCase(); }) || Object.keys(s.certLevels || {}).some(function (x) { return x.toLowerCase() === g.cert.toLowerCase(); }); info = ok ? "certified" : ""; }
          else if (g.key === "shadow") { var sh = picks(s, sessionIndex, "shadow"); if (sessionIndex === 0) sh = sh.concat(arr(s.shadow).filter(function (x) { return R.WHOLE_POS.indexOf(x) >= 0 && sh.indexOf(x) < 0; })); ok = sh.length > 0; info = ok ? "shadow " + sh.join(", ") : ""; }
          else { var wk = picks(s, sessionIndex, "work"); ok = wk.some(function (x) { return x.toLowerCase() === g.cert.toLowerCase(); }); info = ""; }
          if (!ok) return;
          if (g.key === "shadow") {   // one tick per position this person wants to shadow
            var shp = picks(s, sessionIndex, "shadow"); if (sessionIndex === 0) shp = shp.concat(arr(s.shadow).filter(function (x) { return R.WHOLE_POS.indexOf(x) >= 0 && shp.indexOf(x) < 0; }));
            shp.forEach(function (p) {
              var val = p + " | " + label(s); names[val] = 1;
              cands.push('<label class="chk"><input type="checkbox" data-asg-tick="' + esc(id) + '" data-v="' + esc(val) + '"' + (list.indexOf(val) >= 0 ? " checked" : "") + "> " + esc(label(s)) + ' <span class="muted small">shadow ' + esc(p) + "</span></label>");
            });
            return;
          }
          var lab = label(s); names[lab] = 1;
          var lv = s.certLevels && Object.keys(s.certLevels).filter(function (k) { return k.toLowerCase() === (g.cert || "").toLowerCase(); })[0];
          var lvTxt = lv && (s.certLevels[lv] || []).length ? s.certLevels[lv].join("/") : "";
          cands.push('<label class="chk"><input type="checkbox" data-asg-tick="' + esc(id) + '" data-v="' + esc(lab) + '"' + (list.indexOf(lab) >= 0 ? " checked" : "") + "> " + esc(lab) +
            (lvTxt ? ' <span class="chip" style="margin-left:4px">' + esc(lvTxt) + "</span>" : "") + (info && info !== "certified" ? ' <span class="muted small">' + esc(info) + "</span>" : "") + "</label>");
        });
        var typed = list.map(function (nm, i) { var shown = g.key === "shadow" && nm.indexOf(" | ") > 0 ? nm.split(" | ")[1] + " \u2014 shadow " + nm.split(" | ")[0] : nm; return names[nm] ? "" : '<span class="chip">' + esc(shown) + ' <button type="button" aria-label="Remove ' + esc(nm) + '" data-asg-rm="' + id + ":" + i + '">&times;</button></span>'; }).join("");
        var claim = scope === "w" && claims[g.key] ? '<p class="small" style="margin:0 0 6px">Signed up on the sign-up page: <strong>' + esc(claims[g.key].name) + '</strong> <button type="button" class="btn small ghost" data-clear-claim="' + g.key + '">Clear</button></p>' : "";
        return '<div class="asg-group"><h3' + (g.key === "shadow" ? ' class="shadow-h"' : "") + ">" + esc(g.label) + "</h3>" + claim +
          (cands.length ? '<div class="checks">' + cands.join("") + "</div>" : '<p class="muted small" style="margin:0 0 6px">No one has signed up for this yet.</p>') +
          (typed ? '<div class="chips" style="margin-bottom:6px">' + typed + "</div>" : "") +
          '<div class="asg-add">' + (g.key === "shadow" ? '<select data-asg-pos="' + id + '">' + R.WHOLE_POS.concat(R.SESSION_POS).map(function (p) { return "<option>" + esc(p) + "</option>"; }).join("") + "</select>" : "") + '<input data-asg-txt="' + id + '" placeholder="or type a name"><button type="button" class="btn small" data-asg-add="' + id + '">Add</button></div></div>';
      }
      function listFor(scope) { return scope === "w" ? asg.whole : asg.sessions[+scope.slice(1)]; }

      function drawAssign() {
        var missing = R.WHOLE_GROUPS.filter(function (g) { return !asg.whole[g.key].length; }).map(function (g) { return g.label; });
        var html = '<div class="card coord-card"><h2>All sessions</h2>' +
          (missing.length ? '<div class="msg err">Every meet needs a Meet Referee and an Admin Official. Still needed: ' + esc(missing.join(" and ")) + ".</div>" : "") +
          R.WHOLE_GROUPS.map(function (g) { return groupHtml("w", g, asg.whole[g.key]); }).join("") + "</div>";
        n.sessions.forEach(function (x, i) {
          html += '<div class="card coord-card"><h2>' + esc(x.name) + "</h2>" + (R.sessionWhen(x) ? '<p class="muted" style="margin-top:0">' + esc(R.sessionWhen(x)) + "</p>" : "") +
            R.SESSION_GROUPS.map(function (g) { return groupHtml("s" + i, g, asg.sessions[i][g.key], i); }).join("") + "</div>";
        });
        $("assign-area").innerHTML = html;
      }

      function drawTools() {
        var emails = [];
        signups.forEach(function (s) { if (s.email && emails.indexOf(s.email) < 0) emails.push(s.email); });
        var mailto = "mailto:?bcc=" + encodeURIComponent(emails.join(",")).replace(/%2C/g, ",") + "&subject=" + encodeURIComponent(m.title);
        var card = $("tools-card"); card.classList.remove("hidden");
        card.innerHTML = '<h2>Email officials</h2><div class="btn-row" style="margin-top:0">' +
          (emails.length ? '<a class="btn" href="' + mailto + '">Email officials</a>' : '<button class="btn" disabled>Email officials</button>') +
          '<button class="btn ghost" id="copyemails"' + (emails.length ? "" : " disabled") + ">Copy all emails (" + emails.length + ")</button></div>" +
          '<p class="hint">"Email officials" opens your email app with everyone on blind copy and the meet name as the subject. If your email app cuts off a long list, use Copy all emails instead.</p>';
        var ce = $("copyemails");
        if (ce) ce.onclick = function () { R.copyText(emails.join(", ")).then(function () { ce.textContent = "Copied!"; }); };
      }

      app.addEventListener("click", function (e) {
        var t = e.target, g = function (a) { return t.getAttribute && t.getAttribute(a); };
        if (g("data-asg-rm")) {
          var pr = g("data-asg-rm").split(":"); listFor(pr[0])[pr[1]].splice(+pr[2], 1); drawAssign();
        } else if (g("data-asg-add")) {
          var id = g("data-asg-add"), pr2 = id.split(":");
          var txt = document.querySelector('[data-asg-txt="' + id + '"]');
          var v = txt.value.trim(), ps = document.querySelector('[data-asg-pos="' + id + '"]'); if (v && ps) v = ps.value + " | " + v; var list = listFor(pr2[0])[pr2[1]];
          if (v && list.indexOf(v) < 0) list.push(v);
          drawAssign();
        } else if (t.id === "asg-save") {
          var st = $("asg-status"); t.disabled = true;
          meetRef.update({ assignments: asg }).then(function () {
            st.innerHTML = '<div class="msg ok">Saved. <a href="' + detailsUrl + '">See the published assignments</a></div>';
          }).catch(function () { st.innerHTML = '<div class="msg err">Could not save. Please try again.</div>'; })
            .then(function () { t.disabled = false; });
        } else if (g("data-clear-claim")) {
          var ck = g("data-clear-claim");
          meetRef.collection("whole").doc(ck).delete().then(function () { delete claims[ck]; drawAssign(); }).catch(function () { alert("Could not clear that."); });
        } else if (g("data-remove")) {
          var rid = g("data-remove");
          if (!confirm("Remove this person's sign-up?")) return;
          meetRef.collection("contacts").doc(rid).delete().then(load).catch(function () { alert("Could not remove that sign-up."); });
        }
      });

      app.addEventListener("change", function (e) {   // tick a name to assign them, untick to remove
        var t = e.target, id = t.getAttribute && t.getAttribute("data-asg-tick");
        if (!id) return;
        var pr = id.split(":"), list = listFor(pr[0])[pr[1]], v = t.getAttribute("data-v"), at = list.indexOf(v);
        if (t.checked && at < 0) list.push(v); else if (!t.checked && at >= 0) list.splice(at, 1);
        var y = window.scrollY; drawAssign(); window.scrollTo(0, y);
      });

      function load() {
        meetRef.collection("whole").get().then(function (cs) { claims = {}; cs.docs.forEach(function (d) { claims[d.id] = d.data(); }); drawAssign(); }).catch(function () {});
        return meetRef.collection("contacts").orderBy("createdAt").get().then(function (cs) {
          signups = cs.docs.map(function (d) { var s = d.data(); s.id = d.id; return s; });
          drawPeople(); drawAssign(); drawTools();
        }).catch(function () { $("people").innerHTML = '<div class="msg err">Could not load the sign-ups.</div>'; });
      }
      load();
    }
  });
})();
</script>
</body>
</html>
