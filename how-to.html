  <p class="crumb"><a href="docs.html">&larr; All documents</a></p>
  <h1>Steps to become an official</h1>
  <p class="muted">Work through these steps in order and check each one off as you finish. Your progress is saved to your account.</p>
  <div class="btn-row">
    <a class="btn small ghost" href="docs/training/USA_Swimming_Officials_How_To_for_Riptide.docx" download>Download as Word</a>
    <button class="btn small ghost" type="button" data-print>Print</button>
    <button class="btn small ghost" type="button" data-reset>Start over</button>
  </div>
</div>
<div id="progress"></div>
<div class="card contact-card">
  <div><strong>Riptide Officials Coordinator</strong><br>Wendy Peterson</div>
  <div><a href="mailto:whpeterson@gmail.com">whpeterson@gmail.com</a><br><a href="tel:+16127087227">612-708-7227</a></div>
  <div><a href="https://www.usaswimming.org/" target="_blank" rel="noopener">USA Swimming Officials website</a><br><a href="https://www.teamunify.com/team/czmnlsc/page/officials2" target="_blank" rel="noopener">Minnesota Swimming Officials page</a></div>
</div>
<section class="step card" id="step-1" data-editable>
  <input type="checkbox" class="stepbox" data-step="s1" aria-label="Mark step 1 done">
  <div class="body"><div class="num">Step 1</div><h2>Register with USA Swimming as an Apprentice</h2>

    <p>If you did <strong>not</strong> create a Parent account when you registered your swimmer, do this first: <a href="https://www.usaswimming.org/sign-in" target="_blank" rel="noopener">register an account or log in</a>.</p>
    <p>Use the Riptide team link to get started. If you already have a Parent account, log in with that same account.</p>
    <div data-team-link style="margin:10px 0">Loading the team link...</div>
    <p>Choose <strong>Apprentice Official</strong>. The apprentice membership gives you access to the officials' education resources for a <strong>60-day grace period</strong> with no membership fee. Try to finish every step within the 60 days. You are allowed on deck to shadow during this time.</p>
    <img class="shot" src="assets/img/guide/pay-later.png" alt="Checkout screen showing the Pay for this later option" loading="lazy">
    <p>Proceed to checkout and choose <strong>&ldquo;Pay for this Later&rdquo;</strong>.</p>
    <p>After the 60 days, you will need to register as an Official. See the step-by-step <a href="register.html">Register with USA Swimming</a> page, or the <a href="https://docs.google.com/document/d/1l-mcmnjZHFdIezmzTYrdT4eIydvNo4T4/edit?usp=sharing&amp;ouid=103882449600752076109&amp;rtpof=true&amp;sd=true" target="_blank" rel="noopener">Riptide Registration Instructions</a>.</p>
    <div class="callout warn">If you have not completed all of the steps on this page, you will be listed as <strong>&ldquo;Not in good standing&rdquo;</strong> and will not be allowed to shadow or work Stroke &amp; Turn on deck until everything is done.</div>

  </div>
</section>
<section class="step card" id="step-2" data-editable>
  <input type="checkbox" class="stepbox" data-step="s2" aria-label="Mark step 2 done">
  <div class="body"><div class="num">Step 2</div><h2>Athlete Protection Training (Safe Sport)</h2>

    <ul>
      <li><a href="https://www.usaswimming.org/resource-center/athlete-protection-training" target="_blank" rel="noopener">Athlete Protection Training</a> (APT). You must complete it <strong>every year</strong>.</li>
      <li>It must be added to your cart and checked out before you can start.</li>
      <li>It takes about 45 minutes.</li>
    </ul>

  </div>
</section>
<section class="step card" id="step-3" data-editable>
  <input type="checkbox" class="stepbox" data-step="s3" aria-label="Mark step 3 done">
  <div class="body"><div class="num">Step 3</div><h2>Stroke &amp; Turn training and test</h2>

    <p>Complete the Stroke and Turn training for USA Swimming and take the test at <a href="https://university.usaswimming.org/landing" target="_blank" rel="noopener">USA Swimming University</a>. Also take <strong>Foundations of Officiating</strong>.</p>
    <ul><li>Click the <strong>Officials</strong> icon to find both classes.</li></ul>
    <img class="shot sm" src="assets/img/guide/foundations-course.png" alt="Foundations of Officiating course tile" loading="lazy"><img class="shot sm" src="assets/img/guide/stroke-turn-course.png" alt="Stroke and Turn Certification course tile" loading="lazy">
    <div class="callout warn"><strong>Note!</strong> Remember to take the survey at the end to complete each course.</div>

  </div>
</section>
<section class="step card" id="step-4" data-editable>
  <input type="checkbox" class="stepbox" data-step="s4" aria-label="Mark step 4 done">
  <div class="body"><div class="num">Step 4</div><h2>Level 2 background check</h2>

    <p>Complete a level 2 background check. It must be renewed <strong>every 2 years</strong>.</p>
    <ul>
      <li><a href="https://www.usaswimming.org/safe-sport/complete-a-background-check" target="_blank" rel="noopener">Start your background check</a></li>
      <li>Riptide will reimburse you. Fill out <a href="https://docs.google.com/document/d/1XJrp9ALAenQnevwmj3LvLAI39AaHMM5x/edit" target="_blank" rel="noopener">this form</a>. You <strong>must</strong> include a copy of your receipt and email it to <a href="mailto:hr@elsmoreswim.com">hr@elsmoreswim.com</a>.</li>
    </ul>

  </div>
</section>
<section class="step card" id="step-5" data-editable>
  <input type="checkbox" class="stepbox" data-step="s5" aria-label="Mark step 5 done">
  <div class="body"><div class="num">Step 5</div><h2>Concussion protocol training</h2>

    <p>Take either the CDC or the NFHS course:</p>
    <ul>
      <li><strong>CDC:</strong> <a href="http://www.cdc.gov/headsup/youthsports/training/index.html" target="_blank" rel="noopener">cdc.gov/headsup/youthsports/training</a>. On the right side of the page, find the window and launch the course.</li>
      <li><strong>NFHS:</strong> <a href="https://nfhslearn.com/courses/concussion-in-sports-2" target="_blank" rel="noopener">nfhslearn.com/courses/concussion-in-sports-2</a></li>
    </ul>
    <p>Watch the materials and take the quiz. Save the certificate as a PDF and email it to <a href="mailto:bvonderharr@mnswim.org">bvonderharr@mnswim.org</a>.</p>
    <div class="callout">You must already have a USA Swimming account so your credentials can be updated. Register with USA Swimming (Step 1) <strong>before</strong> you do the concussion training.</div>

  </div>
</section>
<section class="step card" id="step-6" data-editable>
  <input type="checkbox" class="stepbox" data-step="s6" aria-label="Mark step 6 done">
  <div class="body"><div class="num">Step 6</div><h2>Watch the Stroke &amp; Turn training videos</h2>

    <p>Very useful! Find the videos at the bottom of the page: <a href="https://www.usaswimming.org/officials/how-to-become-an-official" target="_blank" rel="noopener">usaswimming.org/officials/how-to-become-an-official</a></p>

  </div>
</section>
<section class="step card" id="step-7" data-editable>
  <input type="checkbox" class="stepbox" data-step="s7" aria-label="Mark step 7 done">
  <div class="body"><div class="num">Step 7</div><h2>Shadow sessions at sanctioned USA Swimming meets (XJ)</h2>

    <ul>
      <li>Print the Stroke and Turn (ST) Apprentice Form from the <a href="apprentice-forms.html">Apprentice Forms</a> page (there is one for non-swimmers and non-coaches, and one for former swimmers and coaches). Get a signature from the Meet Ref at each session.</li>
      <li>Use the <a href="https://www.teamunify.com/czmnlsc/UserFiles/File/Officials/StrokeTurnJudgeOn-DeckTrainingGuide.pdf" target="_blank" rel="noopener">ST session guide</a>. Print it and use it as a reference for each session.</li>
      <li>Bring a clipboard to each shadow session.</li>
    </ul>

  </div>
</section>
<section class="step card" id="step-8" data-editable>
  <input type="checkbox" class="stepbox" data-step="s8" aria-label="Mark step 8 done">
  <div class="body"><div class="num">Step 8</div><h2>Uniform, tracking and getting connected</h2>

    <p><strong>Officials uniform</strong></p>
    <ul>
      <li>White polo shirt. Your first shirt is provided by Riptide. Additional shirts can be purchased from <a href="https://elsmoreswim.com/teams/minnesota/clubs/minnesota-swim-officials.html?_ga=2.106883011.1500708013.1656338107-2092576183.1642191009" target="_blank" rel="noopener">this link</a>.</li>
      <li>Black pants, shorts, or skirt (belt optional). No yoga pants.</li>
      <li>Black or mostly black shoes, closed toed.</li>
    </ul>
    <p><strong>Officials apparel shops:</strong></p>
    <ul>
      <li><a href="https://elsmoreswim.com/collections/minnesota-swimming-1" target="_blank" rel="noopener">Minnesota Swimming officials apparel</a></li>
      <li><a href="https://www.usaswimmingbrandstore.com/products?s%5Bf%5D%5Bc%5D%5B%5D=%2FMeet+Officials" target="_blank" rel="noopener">USA Swimming officials apparel</a> (Meet Officials)</li>
    </ul>
    <p><strong>Follow your progress:</strong> <a href="https://www.usaswimming.org/officials/popular-resources/officials-tracking-system" target="_blank" rel="noopener">Officials Tracking System</a></p>
    <p><strong>Riptide Officials Google Group:</strong> if you haven't been added already, request a subscription by emailing <a href="mailto:Riptideofficials+subscribe@googlegroups.com">Riptideofficials+subscribe@googlegroups.com</a>.</p>
    <p><strong>Name badge:</strong> contact Wendy Peterson (<a href="mailto:whpeterson@gmail.com">whpeterson@gmail.com</a>) to order one.</p>

  </div>
</section>
<section class="card">
  <h2 class="group-title">Annual USA Swimming officials' maintenance</h2>
  <ul>
    <li>Annual training and testing for recertification at your top level</li>
    <li>Background check every 2 years</li>
    <li>Concussion training update</li>
    <li>Athlete protection training update</li>
    <li>Volunteer at least 5 sessions annually</li>
    <li>Non-athlete member renewal annually. Use the link and instructions on the <a href="register.html">registration page</a>.</li>
  </ul>
</section>
<details class="card" id="advanced" data-editable>
  <summary>Advanced positions</summary>
  <p class="muted">Current apprentice forms for every position are on the <a href="apprentice-forms.html">Apprentice Forms</a> page.</p>
  <h3>Starter (SR)</h3>
  <ul>
    <li><a href="https://www.gomotionapp.com/czmnlsc/UserFiles/File/Officials/9-2024-apprentice-log-starter-to-present_034205.pdf" target="_blank" rel="noopener">Apprentice Form</a>, non-swimmer / non-coach (XS)</li>
    <li><a href="https://www.gomotionapp.com/czmnlsc/UserFiles/File/Officials/9-2024-apprentice-log-starter-former-coach-athlete-to-present_007376.pdf" target="_blank" rel="noopener">Apprentice Form</a>, former swimmer / coach (XS)</li>
    <li>Guideline: after Stroke &amp; Turn for a year</li>
    <li>Starter test: <a href="http://www.usaswimming.org/DesktopDefault.aspx?TabId=1514&amp;Alias=Rainbow&amp;Lang=en" target="_blank" rel="noopener">online</a></li>
  </ul>
  <h3>Meet Ref / Deck Ref (MR/DR)</h3>
  <ul>
    <li>Guideline: after Starter for a year</li>
    <li><a href="https://www.gomotionapp.com/czmnlsc/UserFiles/File/Officials/9-2024-apprentice-log-referee-to-present_071171.pdf" target="_blank" rel="noopener">Apprentice Sheet</a> (XM/XR)</li>
    <li>Referee test: <a href="http://www.usaswimming.org/DesktopDefault.aspx?TabId=1514&amp;Alias=Rainbow&amp;Lang=en" target="_blank" rel="noopener">online</a></li>
  </ul>
  <h3>Admin (AR or AO)</h3>
  <ul>
    <li>Guideline: can be done with (AR) or without (AO) Stroke &amp; Turn</li>

    <li>Admin test: <a href="http://www.usaswimming.org/DesktopDefault.aspx?TabId=1514&amp;Alias=Rainbow&amp;Lang=en" target="_blank" rel="noopener">online</a></li>
  </ul>
  <h3>Chief Judge</h3>
  <ul><li><a href="https://www.gomotionapp.com/czmnlsc/UserFiles/File/Officials/9-2024-apprentice-log-chief-judge-to-present_052224.pdf" target="_blank" rel="noopener">Apprentice Sheet</a></li></ul>
</details>
